<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>行動賣場商品比價系統 v1.1（純觸控極速版）</title>

  <!-- iOS / Android PWA 加入主畫面與全螢幕設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="行動比價系統" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="format-detection" content="telephone=no" />

  <!-- 內嵌 SVG 應用程式圖示（純 XML URL 編碼，無 base64） -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='64' font-size='52' text-anchor='middle' fill='white'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='64' font-size='52' text-anchor='middle' fill='white'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" />

  <!-- SheetJS CDN（支援 3 工作表 .xlsx 匯出，離線時優雅降級提示） -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>

  <!-- ==================== 自包含極速行動優先 CSS（無外部框架依賴） ==================== -->
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --emerald: #059669;
      --emerald-bright: #16a34a;
      --emerald-soft: #ecfdf5;
      --emerald-border: #a7f3d0;
      --sky: #0284c7;
      --sky-soft: #f0f9ff;
      --sky-border: #bae6fd;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --rose: #e11d48;
      --rose-soft: #fff1f2;
      --rose-border: #fecdd3;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.22);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* 強制所有輸入與選單元素 >= 16px，徹底杜絕 iOS Safari 聚焦自動放大 */
    input, select, textarea {
      font-size: 16px !important;
      font-family: inherit;
      color: var(--text);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.97);
    }

    .hidden { display: none !important; }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* 隱藏橫向捲軸但保留流暢觸控滑動 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    /* ==================== 頂部固定導覽列 + 預設賣場列 ==================== */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: linear-gradient(135deg, var(--primary) 0%, var(--emerald) 100%);
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(15, 118, 110, 0.22);
      padding-top: env(safe-area-inset-top);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .header-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ecfdf5;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.16);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-reload {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-reload:hover { background: rgba(255, 255, 255, 0.28); }
    .btn-reload:disabled { opacity: 0.6; }

    /* 頂部賣場快速切換列 */
    .store-bar-wrap {
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .store-bar-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }

    .store-bar-label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .store-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      padding: 2px 0;
    }

    .store-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #f1f5f9;
      color: #334155;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .store-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.28);
    }

    .store-pill-add {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px dashed var(--primary);
      background: var(--emerald-soft);
      color: var(--primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ==================== 主內容區與底部固定導覽列 ==================== */
    .app-main {
      padding: calc(108px + env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 64px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      position: relative;
      transition: color 0.15s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform 0.15s;
    }

    .nav-item.active .nav-item-icon {
      transform: scale(1.1);
    }

    .nav-indicator {
      width: 26px;
      height: 3px;
      border-radius: 999px;
      background: transparent;
      margin-top: 1px;
    }

    .nav-item.active .nav-indicator {
      background: var(--primary);
    }

    /* ==================== 通用卡片、間距與網格 ==================== */
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-clickable {
      cursor: pointer;
      transition: border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .card-clickable:hover {
      border-color: rgba(15, 118, 110, 0.45);
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.08);
    }

    .card-clickable:active {
      transform: scale(0.99);
    }

    /* ==================== 表單控制項 ==================== */
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sub);
      margin-bottom: 5px;
      white-space: nowrap;
    }

    .req { color: var(--rose); margin-left: 2px; }

    .input, .select {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-strong);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
      -webkit-appearance: none;
    }

    .select {
      background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      padding-right: 30px;
      background-color: var(--surface-muted);
      font-weight: 700;
    }

    .input:focus, .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
      background-color: #ffffff;
    }

    .input-bold { font-weight: 800; }
    .input-muted { background: var(--surface-muted); }

    .select:disabled {
      background-color: #e2e8f0;
      color: #64748b;
      cursor: not-allowed;
    }

    /* 搜尋框 */
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 36px 10px 34px;
      border-radius: var(--radius-md);
      border: 1.5px solid transparent;
      background: #f1f5f9;
      outline: none;
      transition: all 0.15s;
    }

    .search-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #cbd5e1;
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==================== 按鈕與標籤系統 ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 10px; }
    .btn-xs { padding: 6px 9px; font-size: 11px; border-radius: 9px; }
    .btn-full { width: 100%; padding: 12px 16px; }

    .btn-primary { background: var(--primary); color: #ffffff; box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-dark { background: #0f172a; color: #ffffff; }
    .btn-soft { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
    .btn-soft:hover { background: #e2e8f0; }
    .btn-emerald-soft { background: var(--emerald-soft); color: var(--primary); border: 1px solid var(--emerald-border); }
    .btn-sky-soft { background: var(--sky-soft); color: #0369a1; border: 1px solid var(--sky-border); }
    .btn-amber-soft { background: var(--amber-soft); color: #b45309; border: 1px solid var(--amber-border); }
    .btn-rose-soft { background: var(--rose-soft); color: var(--rose); border: 1px solid var(--rose-border); }
    .btn-danger { background: var(--rose); color: #ffffff; }
    .btn-amber { background: var(--amber); color: #ffffff; }

    /* 徽章 / 膠囊 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-pill { border-radius: 999px; }
    .badge-emerald { background: var(--emerald-soft); color: var(--primary); border: 1px solid #d1fae5; }
    .badge-winner { background: var(--emerald-bright); color: #ffffff; font-weight: 800; }
    .badge-winner-soft { background: #dcfce7; color: #15803d; font-weight: 800; }
    .badge-slate { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
    .badge-sky { background: var(--sky-soft); color: #0369a1; border: 1px solid var(--sky-border); }
    .badge-amber { background: var(--amber-soft); color: #b45309; border: 1px solid var(--amber-border); }
    .badge-rose { background: var(--rose-soft); color: #be123c; border: 1px solid var(--rose-border); }
    .badge-indigo { background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .badge-orange { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-purple { background: #faf5ff; color: #7e22ce; border: 1px solid #e9d5ff; }

    /* 分類篩選列 */
    .cat-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .cat-pill {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-sub);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cat-pill.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    /* 單位一鍵切換器 */
    .seg-grid {
      display: grid;
      gap: 6px;
    }

    .seg-btn {
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1.5px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-sub);
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .seg-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25);
    }

    .seg-btn-dark.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.22);
    }

    /* ==================== v1.1 核心表單：多入組切換與乘法算式列 ==================== */
    .multipack-toggle-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface-muted);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .multipack-toggle-card.checked {
      background: var(--emerald-soft);
      border-color: var(--primary);
    }

    .multipack-toggle-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      flex-shrink: 0;
      margin: 0;
    }

    .multipack-toggle-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
    }

    .multipack-toggle-sub {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* 乘法算式列（精準適配 375px iPhone，絕不水平溢位） */
    .equation-box {
      background: #f0fdfa;
      border: 1.5px solid #99f6e4;
      border-radius: var(--radius-md);
      padding: 11px 10px;
    }

    .equation-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) auto minmax(0, 1.1fr) minmax(0, 1.05fr);
      gap: 6px;
      align-items: end;
    }

    .equation-grid .input {
      padding: 10px 8px;
      text-align: center;
    }

    .equation-grid .select {
      padding: 10px 24px 10px 8px;
      background-position: right 6px center;
    }

    .equation-times {
      font-size: 18px;
      font-weight: 900;
      color: var(--primary);
      padding-bottom: 10px;
      text-align: center;
      line-height: 1;
    }

    .equation-total-helper {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed #5eead4;
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    /* 促銷膠囊按鈕 */
    .promo-pill {
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      border: 1.5px solid var(--border);
      background: var(--surface-muted);
      color: var(--text-sub);
      transition: all 0.12s;
    }

    .promo-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.25);
    }

    /* 即時白話換算確認區 */
    .verify-box {
      border-radius: var(--radius-md);
      padding: 12px 13px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.45;
    }

    .verify-box.is-valid {
      background: var(--emerald-soft);
      border-color: var(--emerald-border);
      color: #064e3b;
    }

    .verify-box.is-best {
      background: #f0fdf4;
      border-color: #86efac;
      color: #14532d;
    }

    .verify-box.is-higher {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: #78350f;
    }

    .verify-box.is-ref {
      background: var(--amber-soft);
      border-color: var(--amber-border);
      color: #78350f;
    }

    .verify-sentence {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(15, 23, 42, 0.12);
    }

    .verify-price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .verify-price-big {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .verify-compare-line {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 800;
    }

    /* ==================== 歷史最低價 Hero 看板 ==================== */
    .hero-banner {
      border-radius: var(--radius-lg);
      padding: 16px;
      color: #ffffff;
      background: linear-gradient(135deg, #0f766e 0%, #059669 60%, #16a34a 100%);
      box-shadow: 0 6px 18px rgba(5, 150, 105, 0.28);
    }

    .hero-price {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.6px;
    }

    .hero-sub {
      font-size: 12px;
      color: rgba(236, 253, 245, 0.92);
      font-weight: 600;
    }

    .hero-divider {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 800;
      color: #ecfdf5;
    }

    /* ==================== 商品卡與報價卡 ==================== */
    .prod-name {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.25;
      margin: 0;
    }

    .price-figure {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.4px;
    }

    .quote-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .quote-card.is-winner {
      border-color: var(--emerald-bright);
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 42%);
    }

    .quote-card.is-ref {
      border-color: var(--amber-border);
      background: linear-gradient(180deg, #fffbeb 0%, #ffffff 45%);
    }

    .card-footer-bar {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 折疊表單外框 */
    .accordion-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .accordion-card.is-editing {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.16);
    }

    .accordion-trigger {
      width: 100%;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      background: var(--surface);
    }

    .accordion-trigger.open {
      background: var(--emerald-soft);
      border-bottom: 1px solid var(--border);
    }

    .icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      background: var(--primary);
      flex-shrink: 0;
    }

    .icon-circle.amber { background: var(--amber); }

    /* 排序切換器 */
    .sort-toggle {
      display: inline-flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      gap: 2px;
    }

    .sort-btn {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
    }

    .sort-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }

    /* 跨品牌排行榜表格 */
    .group-rank-panel {
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid var(--sky-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .group-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }

    .group-rank-row:last-child { border-bottom: none; }
    .group-rank-row.is-top { background: #f0fdf4; }
    .group-rank-row.is-current { border-left: 3px solid var(--sky); }

    /* ==================== 貨架即時 PK 樣式 ==================== */
    .pk-banner {
      border-radius: var(--radius-lg);
      padding: 14px;
      text-align: center;
      border: 1.5px solid var(--border-strong);
      background: #e2e8f0;
      color: var(--text-sub);
    }

    .pk-banner.has-winner {
      border: none;
      background: linear-gradient(135deg, #0f766e 0%, #16a34a 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.25);
    }

    .pk-banner.is-tie {
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
    }

    .pk-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .pk-card.is-winner {
      border-color: var(--emerald-bright);
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 30%);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }

    .pk-grid-responsive {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .pk-grid-responsive {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* ==================== 統計方塊 ==================== */
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .stat-val {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ==================== 通用彈窗（取代 alert / confirm） ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-panel {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      background: #ffffff;
      border-radius: 22px 22px 0 0;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal-panel {
        border-radius: 20px;
      }
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ==================== 浮動 Toast ==================== */
    .toast-container {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      width: 92%;
      max-width: 380px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes toastPop {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast-msg {
      animation: toastPop 0.2s ease-out forwards;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.26);
    }

    .toast-success { background: rgba(15, 23, 42, 0.94); border: 1px solid rgba(16, 185, 129, 0.45); }
    .toast-info    { background: rgba(15, 118, 110, 0.96); border: 1px solid rgba(255, 255, 255, 0.25); }
    .toast-warning { background: rgba(217, 119, 6, 0.96); border: 1px solid rgba(254, 243, 199, 0.4); }
    .toast-error   { background: rgba(225, 29, 72, 0.96); border: 1px solid rgba(255, 228, 230, 0.4); }

    /* 小型文字工具類 */
    .text-xs { font-size: 12px; }
    .text-xxs { font-size: 11px; }
    .text-muted { color: var(--text-muted); }
    .text-sub { color: var(--text-sub); }
    .text-primary { color: var(--primary); }
    .text-winner { color: var(--emerald-bright); }
    .text-amber { color: var(--amber); }
    .text-rose { color: var(--rose); }
    .font-bold { font-weight: 700; }
    .font-black { font-weight: 900; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- ==================== 頂部固定導覽列 + 預設賣場快速切換列 ==================== -->
  <header class="app-header">
    <div class="container header-top">
      <div class="header-brand">
        <span style="font-size: 19px; line-height: 1;">🛒</span>
        <h1 class="header-title">行動比價系統</h1>
        <span id="app-version-badge" class="version-badge">v1.1</span>
      </div>
      <div class="header-actions">
        <span id="header-today-date" class="date-pill">📅 ----/--/--</span>
        <button id="btn-force-reload" type="button" class="btn-reload" onclick="forceHardReload()" title="清除快取拉取最新版，100%保留本地資料">
          <span>🔄</span>
          <span>更新版本</span>
        </button>
      </div>
    </div>

    <!-- 預設賣場橫向滑動列 -->
    <div class="store-bar-wrap">
      <div class="container store-bar-inner">
        <span class="store-bar-label">📍 賣場</span>
        <div id="store-pill-bar" class="store-pills no-scrollbar"></div>
      </div>
    </div>
  </header>

  <!-- ==================== 主內容捲動區 ==================== -->
  <main id="main-container" class="container app-main"></main>

  <!-- ==================== 底部固定三大主分頁導覽列 ==================== -->
  <nav class="bottom-nav">
    <div id="bottom-nav-grid" class="container bottom-nav-grid"></div>
  </nav>

  <!-- ==================== 通用彈窗遮罩（無 alert / confirm） ==================== -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-panel" class="modal-panel">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">提示</h2>
        <button type="button" class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- ==================== 浮動 Toast 提示 ==================== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- 隱藏 JSON 匯入選擇器 -->
  <input id="json-import-file" type="file" accept=".json,application/json" class="hidden" onchange="handleJsonFileSelect(event)" />

  <!-- ==================== 核心應用程式邏輯 (v1.1) ==================== -->
  <script>
    /*************************************************************************
     * 一、系統常數鎖定、向下相容規範與三大計價維度設定
     *************************************************************************/
    const STORAGE_KEY = "smart_price_compare_v1_official";
    const APP_VERSION = "v1.1";

    const DEFAULT_STORES = [
      "全聯", "家樂福", "好市多", "大潤發", "寶雅", "屈臣氏", "傳統市場", "蝦皮", "momo"
    ];

    const CATEGORIES = [
      "生鮮蔬果", "乳品飲料", "日用清潔", "零食雜貨", "個人護理", "其他"
    ];

    // v1.0 舊版分類與計數單位無縫相容對照表
    const LEGACY_CATEGORY_MAP = {
      "零食乾貨": "零食雜貨",
      "保健美妝": "個人護理"
    };

    const LEGACY_COUNT_UNIT_MAP = {
      "pcs": "顆",
      "pack": "包",
      "bottle": "瓶",
      "sheet": "抽",
      "roll": "捲",
      "pair": "雙"
    };

    const PROMO_TYPES = [
      { id: "原價", label: "原價", badgeClass: "badge-slate" },
      { id: "特價", label: "特價", badgeClass: "badge-rose" },
      { id: "會員價", label: "會員價", badgeClass: "badge-indigo" },
      { id: "買一送一", label: "⚡買一送一", badgeClass: "badge-amber" },
      { id: "第二件5折", label: "⚡第二件5折", badgeClass: "badge-orange" },
      { id: "出清", label: "出清", badgeClass: "badge-purple" }
    ];

    /**
     * 三大計價維度核心定義（含 v1.1 動態白話標籤與多入組算式詞彙）
     */
    const DIMENSIONS = {
      weight: {
        id: "weight",
        label: "重量類",
        icon: "⚖️",
        baseUnit: "g",
        singleQtyLabel: "重量",
        singleQtyPlaceholder: "例如 1 或 500",
        multiCountLabel: "幾包/幾入",
        multiQtyLabel: "每入重量",
        multiContainerWord: "包",
        defaultInputUnit: "g",
        defaultDisplayUnit: "per100g",
        inputUnits: [
          { id: "g", label: "公克", factor: 1 },
          { id: "kg", label: "公斤", factor: 1000 },
          { id: "jin", label: "台斤", factor: 600 },
          { id: "liang", label: "台兩", factor: 37.5 },
          { id: "lb", label: "磅", factor: 453.6 },
          { id: "oz", label: "盎司", factor: 28.35 }
        ],
        displayUnits: [
          { id: "per100g", label: "元/100公克", unitText: "100公克", multiplier: 100 },
          { id: "perKg", label: "元/公斤", unitText: "公斤", multiplier: 1000 },
          { id: "perJin", label: "元/台斤", unitText: "台斤", multiplier: 600 },
          { id: "perG", label: "元/公克", unitText: "公克", multiplier: 1 }
        ]
      },
      volume: {
        id: "volume",
        label: "容量類",
        icon: "💧",
        baseUnit: "ml",
        singleQtyLabel: "容量",
        singleQtyPlaceholder: "例如 1858 或 2",
        multiCountLabel: "幾瓶/幾罐",
        multiQtyLabel: "每瓶容量",
        multiContainerWord: "瓶",
        defaultInputUnit: "ml",
        defaultDisplayUnit: "per100ml",
        inputUnits: [
          { id: "ml", label: "毫升", factor: 1 },
          { id: "L", label: "公升", factor: 1000 },
          { id: "gal", label: "加侖", factor: 3785 }
        ],
        displayUnits: [
          { id: "per100ml", label: "元/100毫升", unitText: "100毫升", multiplier: 100 },
          { id: "perL", label: "元/公升", unitText: "公升", multiplier: 1000 },
          { id: "perMl", label: "元/毫升", unitText: "毫升", multiplier: 1 }
        ]
      },
      count: {
        id: "count",
        label: "計數類",
        icon: "🔢",
        baseUnit: "unit",
        singleQtyLabel: "數量",
        singleQtyPlaceholder: "例如 10 或 110",
        multiCountLabel: "幾包/幾盒",
        multiQtyLabel: "每包數量",
        multiContainerWord: "包",
        defaultInputUnit: "顆",
        defaultDisplayUnit: "per1",
        inputUnits: [
          { id: "顆", label: "顆", factor: 1 },
          { id: "個", label: "個", factor: 1 },
          { id: "包", label: "包", factor: 1 },
          { id: "袋", label: "袋", factor: 1 },
          { id: "瓶", label: "瓶", factor: 1 },
          { id: "罐", label: "罐", factor: 1 },
          { id: "抽", label: "抽", factor: 1 },
          { id: "張", label: "張", factor: 1 },
          { id: "片", label: "片", factor: 1 },
          { id: "捲", label: "捲", factor: 1 },
          { id: "雙", label: "雙", factor: 1 },
          { id: "支", label: "支", factor: 1 },
          { id: "盒", label: "盒", factor: 1 }
        ],
        displayUnits: [
          { id: "per1", label: "元/1單位", unitText: "單位", multiplier: 1 },
          { id: "per100", label: "元/100單位", unitText: "100單位", multiplier: 100 }
        ]
      }
    };

    /*************************************************************************
     * 二、應用程式持久化狀態與暫存 UI 狀態
     *************************************************************************/
    let appState = {
      version: APP_VERSION,
      activeStore: DEFAULT_STORES[0],
      customStores: [],
      products: []
    };

    let uiState = {
      todayDate: "",
      activeTab: "library",            // 'library' | 'pk' | 'manage'
      selectedProductId: null,         // null = 商品清單；有值 = 商品詳情
      searchQuery: "",
      selectedCategory: "全部",
      quoteSort: "price",              // 'price' | 'date'
      showQuoteForm: false,
      editingQuoteId: null,
      showGroupRankingPanel: false,    // 同群組跨品牌綜合排行榜展開狀態
      pk: {
        dimension: "weight",
        displayUnit: "per100g",
        a: { store: DEFAULT_STORES[0], price: "", isMultiPack: false, packCount: "2", unitQty: "", unit: "kg", promoType: "原價", storeManuallySet: false },
        b: { store: DEFAULT_STORES[1], price: "", isMultiPack: false, packCount: "2", unitQty: "", unit: "jin", promoType: "原價", storeManuallySet: false }
      }
    };

    let pendingJsonImportData = null;

    /*************************************************************************
     * 三、日期工具與自動對齊實際日期（Auto-Sync Real Date）
     *************************************************************************/
    function getTodayDateString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getOffsetDateString(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function calcDaysBetween(dateStr, baseDateStr) {
      if (!dateStr || !baseDateStr) return 0;
      const d1 = new Date(dateStr + "T00:00:00");
      const d2 = new Date(baseDateStr + "T00:00:00");
      if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    /** 價格新鮮度判定（<=30天綠標、31-90天中性、>90天橘黃舊報價提醒） */
    function getFreshnessInfo(checkDate) {
      const days = calcDaysBetween(checkDate, uiState.todayDate);
      if (days <= 0) {
        return { days: 0, label: "今日", statusText: "今日", badgeClass: "badge-winner-soft" };
      }
      if (days <= 30) {
        return { days, label: `${days}天前`, statusText: "近期(30天內)", badgeClass: "badge-emerald" };
      }
      if (days <= 90) {
        return { days, label: `${days}天前`, statusText: "一般(31-90天)", badgeClass: "badge-slate" };
      }
      return { days, label: `⏳ 舊報價參考 (${days}天前)`, statusText: "舊報價參考", badgeClass: "badge-amber" };
    }

    function checkAndAutoSyncRealDate(isWakeEvent = false) {
      const realToday = getTodayDateString();
      const dateEl = document.getElementById("header-today-date");
      if (uiState.todayDate !== realToday) {
        const hadPrev = Boolean(uiState.todayDate);
        uiState.todayDate = realToday;
        if (dateEl) dateEl.textContent = `📅 ${realToday}`;
        if (hadPrev && isWakeEvent) {
          renderMainContent();
          showToast(`📅 日期已自動對齊今日 (${realToday})`, "info");
        }
      } else if (dateEl) {
        dateEl.textContent = `📅 ${realToday}`;
      }
    }

    /*************************************************************************
     * 四、跨單位換算引擎、動態真實單位名稱與白話確認句產生器
     *************************************************************************/
    function generateId(prefix = "id") {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeGroupTag(tag) {
      const cleaned = (tag || "").trim().replace(/^#+/, "").trim();
      return cleaned ? `#${cleaned}` : "";
    }

    function getAllStores() {
      return Array.from(new Set([...DEFAULT_STORES, ...(appState.customStores || [])]));
    }

    function getDimensionConfig(dimId) {
      return DIMENSIONS[dimId] || DIMENSIONS.weight;
    }

    function getInputUnitConfig(dimId, unitId) {
      const dim = getDimensionConfig(dimId);
      const mapped = dimId === "count" && LEGACY_COUNT_UNIT_MAP[unitId] ? LEGACY_COUNT_UNIT_MAP[unitId] : unitId;
      return dim.inputUnits.find(u => u.id === mapped) || dim.inputUnits[0];
    }

    function getDisplayUnitConfig(dimId, displayUnitId) {
      const dim = getDimensionConfig(dimId);
      return dim.displayUnits.find(u => u.id === displayUnitId) || dim.displayUnits[0];
    }

    function getPromoConfig(promoId) {
      return PROMO_TYPES.find(p => p.id === promoId) || PROMO_TYPES[0];
    }

    function formatUnitPrice(val) {
      if (val === null || !isFinite(val) || val < 0) return "--";
      if (val >= 100) return val.toFixed(1).replace(/\.0$/, "");
      if (val >= 10) return val.toFixed(1).replace(/\.0$/, "");
      if (val >= 1) return val.toFixed(2).replace(/0$/, "").replace(/\.$/, "");
      if (val >= 0.01) return val.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
      return val.toFixed(4);
    }

    function formatNumberWithCommas(val) {
      const n = Number(val);
      if (!isFinite(n)) return "";
      const clean = Number.isInteger(n) ? n : parseFloat(n.toFixed(3));
      return clean.toLocaleString("zh-TW", { maximumFractionDigits: 3 });
    }

    /**
     * 取得實際顯示的單位文字（計數類自動替換為真實單位，如「顆」、「抽」、「100抽」）
     */
    function getEffectiveUnitSuffix(dimId, displayUnitId, specificUnitId = null) {
      const dispCfg = getDisplayUnitConfig(dimId, displayUnitId);
      if (dimId !== "count") return dispCfg.unitText;
      const realUnit = specificUnitId ? getInputUnitConfig("count", specificUnitId).label : "單位";
      return dispCfg.multiplier === 100 ? `100${realUnit}` : realUnit;
    }

    /** 取得商品於計數類時是否所有報價都用同一個真實單位（用來優化切換按鈕文字） */
    function detectUniformCountUnit(product) {
      if (!product || product.dimension !== "count") return null;
      const units = new Set(
        (product.quotes || [])
          .filter(q => !q.isReferenceOnly && q.unit)
          .map(q => getInputUnitConfig("count", q.unit).label)
      );
      return units.size === 1 ? Array.from(units)[0] : null;
    }

    /**
     * 核心單價運算引擎
     */
    function calculateQuoteMetrics(dimId, quote) {
      if (quote.isReferenceOnly) {
        return { valid: false, isReferenceOnly: true, baseUnitPrice: null };
      }
      const price = parseFloat(quote.price);
      const packCount = parseFloat(quote.packCount) || 1;
      const unitQty = parseFloat(quote.unitQty);
      const unitCfg = getInputUnitConfig(dimId, quote.unit);

      if (!isFinite(price) || price <= 0 || !isFinite(packCount) || packCount <= 0 || !isFinite(unitQty) || unitQty <= 0) {
        return { valid: false, isReferenceOnly: false, baseUnitPrice: null };
      }

      const rawTotalInputQty = packCount * unitQty;
      const singleBaseQty = rawTotalInputQty * unitCfg.factor;
      let effectivePrice = price;
      let effectiveBaseQty = singleBaseQty;

      if (quote.promoType === "買一送一") {
        effectivePrice = price;
        effectiveBaseQty = singleBaseQty * 2;
      } else if (quote.promoType === "第二件5折") {
        effectivePrice = price * 1.5;
        effectiveBaseQty = singleBaseQty * 2;
      }

      const baseUnitPrice = effectivePrice / effectiveBaseQty;
      return {
        valid: true,
        isReferenceOnly: false,
        price,
        packCount,
        unitQty,
        unitLabel: unitCfg.label,
        rawTotalInputQty,
        effectivePrice,
        effectiveBaseQty,
        baseUnitPrice
      };
    }

    function getDisplayPrice(dimId, displayUnitId, baseUnitPrice) {
      if (baseUnitPrice === null || !isFinite(baseUnitPrice)) return null;
      const dispCfg = getDisplayUnitConfig(dimId, displayUnitId);
      return baseUnitPrice * dispCfg.multiplier;
    }

    /**
     * 產生 v1.1 白話即時確認句（供報價表單與貨架 PK 共用）
     * 例：「確認內容：花 $149 買 12 包 × 110 抽（共 1,320 抽）」
     * 例：「確認內容：花 $100 買 1 公斤（⚡買一送一，共 2 公斤）」
     */
    function buildPlainConfirmationSentence(dimId, quote, metrics) {
      if (!metrics || !metrics.valid) return "";
      const dim = getDimensionConfig(dimId);
      const priceStr = `$${formatNumberWithCommas(metrics.price)}`;
      const unitStr = metrics.unitLabel;

      let qtyDesc = "";
      if (metrics.packCount > 1) {
        qtyDesc = `${formatNumberWithCommas(metrics.packCount)} ${dim.multiContainerWord} × ${formatNumberWithCommas(metrics.unitQty)} ${unitStr}（共 ${formatNumberWithCommas(metrics.rawTotalInputQty)} ${unitStr}）`;
      } else {
        qtyDesc = `${formatNumberWithCommas(metrics.unitQty)} ${unitStr}`;
      }

      let promoTail = "";
      if (quote.promoType === "買一送一") {
        promoTail = `（⚡買一送一，共 ${formatNumberWithCommas(metrics.rawTotalInputQty * 2)} ${unitStr}）`;
      } else if (quote.promoType === "第二件5折") {
        promoTail = `（⚡第二件5折，2件共 $${formatNumberWithCommas(metrics.effectivePrice)}）`;
      }

      return `確認內容：花 ${priceStr} 買 ${qtyDesc}${promoTail}`;
    }

    /** 報價卡片上的人性化規格摘要 */
    function formatHumanSpec(dimId, quote) {
      const priceText = `$${formatNumberWithCommas(quote.price)}`;
      if (quote.isReferenceOnly) {
        const refUnit = (quote.refUnitText || "份").trim();
        return `${priceText} / ${formatNumberWithCommas(quote.unitQty || 1)} ${refUnit}`;
      }
      const dim = getDimensionConfig(dimId);
      const unitLabel = getInputUnitConfig(dimId, quote.unit).label;
      const pack = parseFloat(quote.packCount) || 1;
      const qty = parseFloat(quote.unitQty) || 0;
      if (pack > 1) {
        const total = pack * qty;
        return `${priceText}｜${formatNumberWithCommas(pack)} ${dim.multiContainerWord} × ${formatNumberWithCommas(qty)} ${unitLabel}（共 ${formatNumberWithCommas(total)} ${unitLabel}）`;
      }
      return `${priceText}｜${formatNumberWithCommas(qty)} ${unitLabel}`;
    }

    /** 分析單一商品的所有報價排名與統計 */
    function analyzeProductQuotes(product) {
      const quotes = Array.isArray(product.quotes) ? product.quotes : [];
      const ranked = [];
      const references = [];

      quotes.forEach(q => {
        const m = calculateQuoteMetrics(product.dimension, q);
        if (q.isReferenceOnly || !m.valid) {
          references.push({ ...q, metrics: m });
        } else {
          ranked.push({ ...q, metrics: m, baseUnitPrice: m.baseUnitPrice });
        }
      });

      ranked.sort((a, b) => {
        if (Math.abs(a.baseUnitPrice - b.baseUnitPrice) > 1e-9) {
          return a.baseUnitPrice - b.baseUnitPrice;
        }
        return (b.checkDate || "").localeCompare(a.checkDate || "");
      });

      const bestBase = ranked.length > 0 ? ranked[0].baseUnitPrice : null;
      ranked.forEach((item, idx) => {
        item.priceRank = idx + 1;
        if (bestBase && bestBase > 0) {
          const pct = ((item.baseUnitPrice - bestBase) / bestBase) * 100;
          item.diffPct = pct < 0.05 ? 0 : pct;
        } else {
          item.diffPct = 0;
        }
      });

      references.sort((a, b) => (b.checkDate || "").localeCompare(a.checkDate || ""));

      let latestDate = "";
      quotes.forEach(q => {
        if (q.checkDate && q.checkDate > latestDate) latestDate = q.checkDate;
      });

      return {
        ranked,
        references,
        bestQuote: ranked[0] || null,
        secondQuote: ranked[1] || null,
        totalCount: quotes.length,
        latestDate
      };
    }

    function saveData() {
      try {
        appState.version = APP_VERSION;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error("儲存 localStorage 失敗:", err);
        showToast("⚠️ 儲存空間不足，請先匯出 JSON 備份", "error");
      }
    }

    function migrateProductSchema(p) {
      if (!DIMENSIONS[p.dimension]) p.dimension = "weight";
      const dim = DIMENSIONS[p.dimension];
      if (!dim.displayUnits.some(u => u.id === p.displayUnit)) {
        p.displayUnit = dim.defaultDisplayUnit;
      }
      if (LEGACY_CATEGORY_MAP[p.category]) {
        p.category = LEGACY_CATEGORY_MAP[p.category];
      }
      if (!CATEGORIES.includes(p.category)) {
        p.category = "其他";
      }
      p.groupTag = normalizeGroupTag(p.groupTag || "");
      if (!Array.isArray(p.quotes)) p.quotes = [];

      // 向下相容遷移 v1.0 舊版計數單位代碼
      p.quotes.forEach(q => {
        if (p.dimension === "count" && LEGACY_COUNT_UNIT_MAP[q.unit]) {
          q.unit = LEGACY_COUNT_UNIT_MAP[q.unit];
        }
        if (!q.packCount || q.packCount < 1) q.packCount = 1;
      });
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw === null) {
          appState = {
            version: APP_VERSION,
            activeStore: DEFAULT_STORES[0],
            customStores: [],
            products: createDemoProducts()
          };
          saveData();
          return;
        }

        const parsed = JSON.parse(raw);
        appState = {
          version: APP_VERSION,
          activeStore: parsed.activeStore || DEFAULT_STORES[0],
          customStores: Array.isArray(parsed.customStores) ? parsed.customStores : [],
          products: Array.isArray(parsed.products) ? parsed.products : []
        };

        appState.products.forEach(migrateProductSchema);

        if (!getAllStores().includes(appState.activeStore)) {
          appState.activeStore = DEFAULT_STORES[0];
        }
        saveData();
      } catch (err) {
        console.error("讀取 localStorage 失敗:", err);
        appState = {
          version: APP_VERSION,
          activeStore: DEFAULT_STORES[0],
          customStores: [],
          products: createDemoProducts()
        };
        saveData();
      }
    }

    /*************************************************************************
     * 六、一鍵穿透快取強制更新機制（100% 保留 localStorage）
     *************************************************************************/
    async function forceHardReload() {
      const btn = document.getElementById("btn-force-reload");
      if (btn) btn.disabled = true;
      showToast("🔄 清除快取並拉取最新版中（本地資料 100% 保留）...", "info");

      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }

        const baseUrl = window.location.href.split("?")[0];
        if (window.location.protocol.startsWith("http")) {
          await fetch(baseUrl, { cache: "no-store" }).catch(() => {});
          window.location.replace(`${baseUrl}?v=${Date.now()}`);
        } else {
          showToast("✅ 快取已清除，所有比價資料完整保留！", "success");
          if (btn) btn.disabled = false;
        }
      } catch (err) {
        console.warn("強制更新回退:", err);
        try {
          window.location.reload();
        } catch (e) {
          if (btn) btn.disabled = false;
        }
      }
    }

    /*************************************************************************
     * 七、Toast 提示與通用彈窗（完全不使用 alert / confirm）
     *************************************************************************/
    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const el = document.createElement("div");
      el.className = `toast-msg toast-${type}`;
      el.textContent = message;
      container.innerHTML = "";
      container.appendChild(el);
      setTimeout(() => {
        el.style.transition = "opacity 0.25s ease";
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 260);
      }, 2400);
    }

    function openModal({ title, bodyHtml, footerHtml }) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").innerHTML = bodyHtml;
      document.getElementById("modal-footer").innerHTML = footerHtml || "";
      document.getElementById("modal-backdrop").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("modal-backdrop").classList.add("hidden");
      document.body.style.overflow = "";
    }

    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });

    function openConfirmModal({ title, message, confirmText = "確認", confirmBtnClass = "btn-danger", onConfirm }) {
      window._pendingConfirmAction = () => {
        closeModal();
        if (typeof onConfirm === "function") onConfirm();
      };
      openModal({
        title,
        bodyHtml: `<p style="margin:0; font-size:14px; color:#334155; line-height:1.6; white-space:pre-line;">${escapeHtml(message)}</p>`,
        footerHtml: `
          <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">取消</button>
          <button type="button" class="btn ${confirmBtnClass} btn-sm" onclick="window._pendingConfirmAction()">${escapeHtml(confirmText)}</button>
        `
      });
    }

    /*************************************************************************
     * 九、分頁一（A）：📦 我的比價庫 — 階梯式檢索與商品清單
     *************************************************************************/
    function getFilteredProducts() {
      const q = (uiState.searchQuery || "").trim().toLowerCase();
      const cat = uiState.selectedCategory;

      const list = appState.products.filter(p => cat === "全部" || p.category === cat);
      if (!q) {
        return list.slice().sort((a, b) => {
          const aL = analyzeProductQuotes(a).latestDate || "";
          const bL = analyzeProductQuotes(b).latestDate || "";
          return bL.localeCompare(aL);
        });
      }

      // 階梯式優先權：1.品名完全比對 -> 2.品名前綴 -> 3.品名子字串 -> 4.品牌/群組/分類模糊
      const scored = [];
      list.forEach(p => {
        const name = (p.name || "").toLowerCase();
        const brand = (p.brand || "").toLowerCase();
        const group = (p.groupTag || "").toLowerCase();
        const catText = (p.category || "").toLowerCase();
        let score = 0;
        if (name === q) score = 100;
        else if (name.startsWith(q)) score = 80;
        else if (name.includes(q)) score = 60;
        else if (brand.includes(q) || group.includes(q)) score = 40;
        else if (catText.includes(q)) score = 20;
        if (score > 0) scored.push({ p, score });
      });

      scored.sort((a, b) => b.score - a.score);
      return scored.map(x => x.p);
    }
