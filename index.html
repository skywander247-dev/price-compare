    function toggleGroupRankingPanel() {
      uiState.showGroupRankingPanel = !uiState.showGroupRankingPanel;
      renderProductDetail();
    }

    function switchProductDisplayUnit(productId, displayUnitId) {
      const p = appState.products.find(x => x.id === productId);
      if (!p) return;
      p.displayUnit = displayUnitId;
      saveData();
      renderProductDetail();
    }

    function setQuoteSort(sortMode) {
      uiState.quoteSort = sortMode;
      renderProductDetail();
    }

    function confirmQuoteUnchanged(productId, quoteId) {
      const p = appState.products.find(x => x.id === productId);
      const q = p?.quotes.find(x => x.id === quoteId);
      if (!p || !q) return;

      if (q.checkDate === uiState.todayDate) {
        showToast(`✓「${q.store}」今日 (${uiState.todayDate}) 已確認過`, "info");
        return;
      }
      q.checkDate = uiState.todayDate;
      saveData();
      renderProductDetail();
      showToast(`✓ 已確認「${q.store}」價格未變，日期更新為 ${uiState.todayDate}`, "success");
    }

    function startEditQuote(quoteId) {
      uiState.editingQuoteId = quoteId;
      uiState.showQuoteForm = true;
      renderProductDetail();
      setTimeout(() => {
        document.getElementById("quote-form-wrapper")?.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 60);
    }

    function cancelEditQuote() {
      uiState.editingQuoteId = null;
      uiState.showQuoteForm = false;
      renderProductDetail();
    }

    function confirmDeleteQuote(productId, quoteId) {
      const p = appState.products.find(x => x.id === productId);
      const q = p?.quotes.find(x => x.id === quoteId);
      if (!p || !q) return;

      openConfirmModal({
        title: "🗑️ 刪除賣場報價",
        message: `確定要刪除「${q.store}（${formatHumanSpec(p.dimension, q)}）」這筆報價嗎？此操作無法復原。`,
        confirmText: "確定刪除",
        onConfirm: () => {
          p.quotes = p.quotes.filter(x => x.id !== quoteId);
          if (uiState.editingQuoteId === quoteId) {
            uiState.editingQuoteId = null;
            uiState.showQuoteForm = false;
          }
          saveData();
          renderProductDetail();
          showToast("🗑️ 已刪除該筆報價", "info");
        }
      });
    }

    /*************************************************************************
     * 十一、商品主檔 新增／編輯／刪除 彈窗
     *************************************************************************/
    function openProductModal(productId = null, prefillName = "") {
      const existing = productId ? appState.products.find(p => p.id === productId) : null;
      const hasQuotes = existing && existing.quotes.length > 0;
      const existingGroups = Array.from(new Set(appState.products.map(p => p.groupTag).filter(Boolean)));

      const nameVal = existing ? existing.name : prefillName;
      const brandVal = existing ? (existing.brand || "") : "";
      const catVal = existing ? existing.category : CATEGORIES[0];
      const groupVal = existing ? (existing.groupTag || "") : "";
      const dimVal = existing ? existing.dimension : "weight";

      openModal({
        title: existing ? "✏️ 編輯商品資料" : "➕ 新增比價商品",
        bodyHtml: `
          <div class="stack">
            <div>
              <label class="field-label">商品名稱<span class="req">*</span></label>
              <input id="pm-name" type="text" class="input input-bold" value="${escapeHtml(nameVal)}" placeholder="例如：馬鈴薯、義美全脂鮮乳" />
            </div>

            <div class="grid-2">
              <div>
                <label class="field-label">品牌（選填）</label>
                <input id="pm-brand" type="text" class="input" value="${escapeHtml(brandVal)}" placeholder="例如：義美、舒潔" />
              </div>
              <div>
                <label class="field-label">商品分類</label>
                <select id="pm-category" class="select">
                  ${CATEGORIES.map(c => `<option value="${c}" ${c === catVal ? "selected" : ""}>${c}</option>`).join("")}
                </select>
              </div>
            </div>

            <div>
              <label class="field-label">計價方式（決定換算單位）</label>
              <select id="pm-dimension" class="select" ${hasQuotes ? "disabled" : ""}>
                <option value="weight" ${dimVal === "weight" ? "selected" : ""}>⚖️ 重量類（公克、公斤、台斤、台兩、磅、盎司）</option>
                <option value="volume" ${dimVal === "volume" ? "selected" : ""}>💧 容量類（毫升、公升、加侖）</option>
                <option value="count" ${dimVal === "count" ? "selected" : ""}>🔢 計數類（顆、個、包、袋、瓶、抽、捲、盒...）</option>
              </select>
              ${hasQuotes ? `<div class="text-xxs font-bold text-amber" style="margin-top: 4px;">⚠️ 此商品已有報價紀錄，為防止換算衝突已鎖定計價方式。</div>` : ""}
            </div>

            <div>
              <label class="field-label">同類比價群組標籤（選填，跨品牌比價用）</label>
              <input id="pm-group" type="text" class="input" value="${escapeHtml(groupVal)}" placeholder="例如：#全脂鮮乳、#抽取式衛生紙" />
              ${existingGroups.length > 0 ? `
                <div class="row-wrap" style="margin-top: 7px;">
                  ${existingGroups.map(g => `
                    <button type="button" class="btn btn-sky-soft btn-xs" onclick="document.getElementById('pm-group').value='${escapeHtml(g).replace(/'/g, "\\'")}'">${escapeHtml(g)}</button>
                  `).join("")}
                </div>
              ` : ""}
            </div>
          </div>
        `,
        footerHtml: `
          <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="saveProductFromModal('${existing ? existing.id : ""}')">
            ${existing ? "💾 儲存修改" : "➕ 建立並開始記價"}
          </button>
        `
      });

      if (!existing) {
        setTimeout(() => document.getElementById("pm-name")?.focus(), 100);
      }
    }

    function saveProductFromModal(existingId) {
      const name = (document.getElementById("pm-name")?.value || "").trim();
      const brand = (document.getElementById("pm-brand")?.value || "").trim();
      const category = document.getElementById("pm-category")?.value || CATEGORIES[0];
      const dimension = document.getElementById("pm-dimension")?.value || "weight";
      const groupTag = normalizeGroupTag(document.getElementById("pm-group")?.value || "");

      if (!name) {
        showToast("請輸入商品名稱", "warning");
        document.getElementById("pm-name")?.focus();
        return;
      }

      if (existingId) {
        const p = appState.products.find(x => x.id === existingId);
        if (p) {
          p.name = name;
          p.brand = brand;
          p.category = category;
          p.groupTag = groupTag;
          if (p.quotes.length === 0 && p.dimension !== dimension) {
            p.dimension = dimension;
            p.displayUnit = getDimensionConfig(dimension).defaultDisplayUnit;
          }
          saveData();
          closeModal();
          renderMainContent();
          showToast(`✅ 已更新商品「${name}」`, "success");
        }
      } else {
        const newProd = {
          id: generateId("prod"),
          name,
          brand,
          category,
          groupTag,
          dimension,
          displayUnit: getDimensionConfig(dimension).defaultDisplayUnit,
          quotes: []
        };
        appState.products.unshift(newProd);
        saveData();
        closeModal();
        uiState.searchQuery = "";
        uiState.selectedCategory = "全部";
        openProductDetail(newProd.id);
        showToast(`✅ 已建立「${name}」，可直接輸入價格`, "success");
      }
    }

    function confirmDeleteProduct(productId) {
      const p = appState.products.find(x => x.id === productId);
      if (!p) return;

      openConfirmModal({
        title: "🗑️ 刪除商品與全部報價",
        message: `確定要刪除「${p.name}」以及旗下的 ${p.quotes.length} 筆報價紀錄嗎？此操作無法復原。`,
        confirmText: "確定刪除",
        onConfirm: () => {
          appState.products = appState.products.filter(x => x.id !== productId);
          saveData();
          backToLibraryList();
          showToast(`🗑️ 已刪除「${p.name}」`, "info");
        }
      });
    }

    /*************************************************************************
     * 十二、分頁二：⚖️ 貨架即時 PK（同步套用 v1.1 直覺白話表單與多入組算式列）
     *************************************************************************/
    function renderPkView() {
      const main = document.getElementById("main-container");
      const dim = getDimensionConfig(uiState.pk.dimension);
      const stores = getAllStores();

      if (!dim.inputUnits.some(u => u.id === uiState.pk.a.unit)) uiState.pk.a.unit = dim.defaultInputUnit;
      if (!dim.inputUnits.some(u => u.id === uiState.pk.b.unit)) uiState.pk.b.unit = dim.defaultInputUnit;
      if (!dim.displayUnits.some(u => u.id === uiState.pk.displayUnit)) uiState.pk.displayUnit = dim.defaultDisplayUnit;

      const renderSideCard = (side, label, badgeStyle) => {
        const s = uiState.pk[side];
        const pkPromos = [
          { id: "原價", label: "無" },
          { id: "買一送一", label: "⚡買一送一" },
          { id: "第二件5折", label: "⚡第二件5折" }
        ];
        const unitOpts = dim.inputUnits
          .map(u => `<option value="${u.id}" ${u.id === s.unit ? "selected" : ""}>${u.label}</option>`)
          .join("");

        return `
          <div id="pk-card-${side}" class="pk-card stack-sm" style="gap: 10px;">
            <div class="row-between">
              <div class="row" style="gap: 6px;">
                <span class="badge" style="${badgeStyle} font-size: 12px; padding: 4px 10px; font-weight: 900;">${label}</span>
                <span id="pk-${side}-winner-badge" class="badge badge-pill badge-winner hidden">🏆 較划算</span>
              </div>
              <select
                id="pk-${side}-store"
                class="select"
                style="width: auto; max-width: 132px; padding: 6px 26px 6px 10px; font-size: 13px !important;"
                onchange="handlePkInput('${side}', 'store', this.value)"
              >
                ${stores.map(st => `<option value="${escapeHtml(st)}" ${st === s.store ? "selected" : ""}>${escapeHtml(st)}</option>`).join("")}
              </select>
            </div>

            <!-- 價格 (元) -->
            <div>
              <label class="field-label">價格 (元)<span class="req">*</span></label>
              <input
                id="pk-${side}-price"
                type="number"
                inputmode="decimal"
                step="any"
                min="0"
                class="input input-bold"
                value="${escapeHtml(s.price)}"
                oninput="handlePkInput('${side}', 'price', this.value)"
                placeholder="輸入金額"
              />
            </div>

            <!-- 單件預設模式（2欄：動態白話標題 + 單位） -->
            <div id="pk-${side}-single-row" class="grid-2 ${s.isMultiPack ? "hidden" : ""}">
              <div>
                <label class="field-label">${dim.singleQtyLabel}<span class="req">*</span></label>
                <input
                  id="pk-${side}-single-qty"
                  type="number"
                  inputmode="decimal"
                  step="any"
                  min="0"
                  class="input input-bold"
                  value="${escapeHtml(s.unitQty)}"
                  oninput="syncPkQty('${side}', 'single', this.value)"
                  placeholder="${dim.singleQtyPlaceholder}"
                />
              </div>
              <div>
                <label class="field-label">單位</label>
                <select id="pk-${side}-single-unit" class="select" onchange="syncPkUnit('${side}', 'single', this.value)">
                  ${unitOpts}
                </select>
              </div>
            </div>

            <!-- 多入組乘法算式列 -->
            <div id="pk-${side}-multi-row" class="equation-box ${s.isMultiPack ? "" : "hidden"}">
              <div class="equation-grid">
                <div>
                  <label class="field-label">${dim.multiCountLabel}</label>
                  <input
                    id="pk-${side}-multi-pack"
                    type="number"
                    inputmode="decimal"
                    step="any"
                    min="1"
                    class="input input-bold"
                    value="${escapeHtml(s.packCount)}"
                    oninput="handlePkInput('${side}', 'packCount', this.value)"
                    placeholder="如 6"
                  />
                </div>
                <div class="equation-times">×</div>
                <div>
                  <label class="field-label">${dim.multiQtyLabel}</label>
                  <input
                    id="pk-${side}-multi-qty"
                    type="number"
                    inputmode="decimal"
                    step="any"
                    min="0"
                    class="input input-bold"
                    value="${escapeHtml(s.unitQty)}"
                    oninput="syncPkQty('${side}', 'multi', this.value)"
                    placeholder="如 330"
                  />
                </div>
                <div>
                  <label class="field-label">單位</label>
                  <select id="pk-${side}-multi-unit" class="select" onchange="syncPkUnit('${side}', 'multi', this.value)">
                    ${unitOpts}
                  </select>
                </div>
              </div>
              <div id="pk-${side}-multi-helper" class="equation-total-helper">👉 總量自動試算：--</div>
            </div>

            <!-- 獨立多入組切換開關 -->
            <label id="pk-${side}-multi-card" class="multipack-toggle-card ${s.isMultiPack ? "checked" : ""}" style="padding: 9px 10px;">
              <input id="pk-${side}-multi-toggle" type="checkbox" ${s.isMultiPack ? "checked" : ""} onchange="togglePkMultiPack('${side}', this.checked)" />
              <span class="multipack-toggle-text" style="font-size: 12px;">📦 這是多入組（如 6 瓶裝、12 包/串）</span>
            </label>

            <!-- 促銷快捷鈕 -->
            <div id="pk-${side}-promos" class="grid-3">
              ${pkPromos.map(pr => `
                <button
                  type="button"
                  data-promo="${pr.id}"
                  class="promo-pill ${s.promoType === pr.id ? "active" : ""}"
                  style="padding: 7px 4px; font-size: 11px; text-align: center;"
                  onclick="setPkPromo('${side}', '${pr.id}')"
                >${pr.label}</button>
              `).join("")}
            </div>

            <!-- 白話即時確認區 -->
            <div id="pk-${side}-verify" class="verify-box" style="padding: 10px 11px;">
              <span class="text-xxs text-muted">輸入價格與${dim.singleQtyLabel}即時換算單價</span>
            </div>
          </div>
        `;
      };

      main.innerHTML = `
        <div class="stack">
          <!-- 維度與顯示單位一鍵切換卡 -->
          <div class="card stack-sm" style="padding: 12px;">
            <div class="grid-3">
              ${Object.values(DIMENSIONS).map(d => `
                <button
                  type="button"
                  class="seg-btn seg-btn-dark ${uiState.pk.dimension === d.id ? "active" : ""}"
                  onclick="setPkDimension('${d.id}')"
                >${d.icon} ${d.label}</button>
              `).join("")}
            </div>

            <div class="seg-grid" style="grid-template-columns: repeat(${dim.displayUnits.length}, minmax(0, 1fr));">
              ${dim.displayUnits.map(du => `
                <button
                  type="button"
                  class="seg-btn ${uiState.pk.displayUnit === du.id ? "active" : ""}"
                  onclick="setPkDisplayUnit('${du.id}')"
                >${du.label}</button>
              `).join("")}
            </div>
          </div>

          <!-- 即時勝負看板 -->
          <div id="pk-winner-banner" class="pk-banner">
            <div class="text-xs font-black">輸入商品 A 與商品 B 的價格與${dim.singleQtyLabel}，立即判定誰較划算！</div>
          </div>

          <!-- 商品 A / 商品 B PK 卡片 -->
          <div class="pk-grid-responsive">
            ${renderSideCard("a", "商品 A", "background:#e0f2fe; color:#0369a1;")}
            ${renderSideCard("b", "商品 B", "background:#f3e8ff; color:#6d28d9;")}
          </div>

          <!-- 底部操作列 -->
          <div class="grid-2">
            <button type="button" class="btn btn-soft btn-full" style="background: #ffffff;" onclick="resetPkFields()">🔄 清空重算</button>
            <button type="button" class="btn btn-primary btn-full" onclick="openPkSaveModal()">💾 轉存至比價庫</button>
          </div>
        </div>
      `;

      updatePkLiveUI();
    }

    function setPkDimension(dimId) {
      uiState.pk.dimension = dimId;
      const dim = getDimensionConfig(dimId);
      uiState.pk.displayUnit = dim.defaultDisplayUnit;
      uiState.pk.a.unit = dim.defaultInputUnit;
      uiState.pk.b.unit = dim.defaultInputUnit;
      renderPkView();
    }

    function setPkDisplayUnit(displayUnitId) {
      uiState.pk.displayUnit = displayUnitId;
      renderPkView();
    }

    function handlePkInput(side, field, value) {
      uiState.pk[side][field] = value;
      if (field === "store") uiState.pk[side].storeManuallySet = true;
      updatePkLiveUI();
    }

    function syncPkQty(side, source, val) {
      uiState.pk[side].unitQty = val;
      const other = source === "single" ? "multi" : "single";
      const otherEl = document.getElementById(`pk-${side}-${other}-qty`);
      if (otherEl) otherEl.value = val;
      updatePkLiveUI();
    }

    function syncPkUnit(side, source, val) {
      uiState.pk[side].unit = val;
      const other = source === "single" ? "multi" : "single";
      const otherEl = document.getElementById(`pk-${side}-${other}-unit`);
      if (otherEl) otherEl.value = val;
      updatePkLiveUI();
    }

    function togglePkMultiPack(side, checked) {
      uiState.pk[side].isMultiPack = checked;
      document.getElementById(`pk-${side}-single-row`)?.classList.toggle("hidden", checked);
      document.getElementById(`pk-${side}-multi-row`)?.classList.toggle("hidden", !checked);
      document.getElementById(`pk-${side}-multi-card`)?.classList.toggle("checked", checked);
      updatePkLiveUI();
    }

    function setPkPromo(side, promoId) {
      uiState.pk[side].promoType = promoId;
      document.querySelectorAll(`#pk-${side}-promos button`).forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-promo") === promoId);
      });
      updatePkLiveUI();
    }

    function buildPkSideQuote(side) {
      const s = uiState.pk[side];
      return {
        store: s.store,
        price: s.price,
        packCount: s.isMultiPack ? s.packCount : 1,
        unitQty: s.unitQty,
        unit: s.unit,
        promoType: s.promoType,
        isReferenceOnly: false
      };
    }

    function updatePkLiveUI() {
      const dimId = uiState.pk.dimension;
      const dim = getDimensionConfig(dimId);
      const dispId = uiState.pk.displayUnit;

      const results = {};
      ["a", "b"].forEach(side => {
        const s = uiState.pk[side];
        const qObj = buildPkSideQuote(side);
        const m = calculateQuoteMetrics(dimId, qObj);
        results[side] = { qObj, m };

        // 更新多入組即時總量提示
        const helperEl = document.getElementById(`pk-${side}-multi-helper`);
        if (helperEl && s.isMultiPack) {
          const pk = parseFloat(s.packCount);
          const qty = parseFloat(s.unitQty);
          const uLabel = getInputUnitConfig(dimId, s.unit).label;
          if (isFinite(pk) && pk > 0 && isFinite(qty) && qty > 0) {
            helperEl.textContent = `👉 總量自動試算：${formatNumberWithCommas(pk)} × ${formatNumberWithCommas(qty)} = ${formatNumberWithCommas(pk * qty)} ${uLabel}`;
          } else {
            helperEl.textContent = `👉 總量自動試算：請輸入${dim.multiCountLabel}與${dim.multiQtyLabel}`;
          }
        }

        // 更新單邊白話確認盒
        const vBox = document.getElementById(`pk-${side}-verify`);
        if (vBox) {
          if (m.valid) {
            const val = getDisplayPrice(dimId, dispId, m.baseUnitPrice);
            const suffix = getEffectiveUnitSuffix(dimId, dispId, s.unit);
            const sentence = buildPlainConfirmationSentence(dimId, qObj, m);
            vBox.className = "verify-box is-valid";
            vBox.innerHTML = `
              <div class="verify-sentence" style="font-size: 11px;">${escapeHtml(sentence)}</div>
              <div class="verify-price-row">
                <span class="text-xs font-bold">換算單價</span>
                <span class="verify-price-big" style="font-size: 18px;">$${formatUnitPrice(val)} <span style="font-size: 12px; font-weight: 700;">/ ${escapeHtml(suffix)}</span></span>
              </div>
            `;
          } else {
            vBox.className = "verify-box";
            vBox.innerHTML = `<span class="text-xxs text-muted">輸入價格與${dim.singleQtyLabel}後即時試算</span>`;
          }
        }

        document.getElementById(`pk-card-${side}`)?.classList.remove("is-winner");
        document.getElementById(`pk-${side}-winner-badge`)?.classList.add("hidden");
      });

      const banner = document.getElementById("pk-winner-banner");
      if (!banner) return;

      const mA = results.a.m;
      const mB = results.b.m;

      if (mA.valid && mB.valid) {
        const valA = getDisplayPrice(dimId, dispId, mA.baseUnitPrice);
        const valB = getDisplayPrice(dimId, dispId, mB.baseUnitPrice);
        const sufA = getEffectiveUnitSuffix(dimId, dispId, uiState.pk.a.unit);
        const sufB = getEffectiveUnitSuffix(dimId, dispId, uiState.pk.b.unit);

        if (Math.abs(mA.baseUnitPrice - mB.baseUnitPrice) < 1e-9) {
          banner.className = "pk-banner is-tie";
          banner.innerHTML = `
            <div style="font-size: 16px; font-weight: 900;">🤝 商品 A 與商品 B 單價完全相同！</div>
            <div class="text-xs" style="margin-top: 3px; opacity: 0.92;">皆為 $${formatUnitPrice(valA)} / ${escapeHtml(sufA)}</div>
          `;
        } else {
          const aWins = mA.baseUnitPrice < mB.baseUnitPrice;
          const winSide = aWins ? "a" : "b";
          const winLabel = aWins ? "商品 A" : "商品 B";
          const winVal = aWins ? valA : valB;
          const loseVal = aWins ? valB : valA;
          const winSuf = aWins ? sufA : sufB;
          const loseSuf = aWins ? sufB : sufA;
          const savePct = ((Math.abs(mA.baseUnitPrice - mB.baseUnitPrice)) / Math.max(mA.baseUnitPrice, mB.baseUnitPrice)) * 100;

          document.getElementById(`pk-card-${winSide}`)?.classList.add("is-winner");
          document.getElementById(`pk-${winSide}-winner-badge`)?.classList.remove("hidden");

          banner.className = "pk-banner has-winner";
          banner.innerHTML = `
            <div style="font-size: 17px; font-weight: 900;">🏆 ${winLabel} 較划算！便宜 ${savePct.toFixed(1)}%</div>
            <div class="text-xs" style="margin-top: 4px; opacity: 0.95; font-weight: 700;">
              ${winLabel} $${formatUnitPrice(winVal)}/${escapeHtml(winSuf)} vs 對手 $${formatUnitPrice(loseVal)}/${escapeHtml(loseSuf)}
            </div>
          `;
        }
      } else {
        banner.className = "pk-banner";
        banner.innerHTML = `<div class="text-xs font-black">輸入商品 A 與商品 B 的價格與${dim.singleQtyLabel}，立即判定誰較划算！</div>`;
      }
    }

    function resetPkFields() {
      const dim = getDimensionConfig(uiState.pk.dimension);
      uiState.pk.a = { store: appState.activeStore, price: "", isMultiPack: false, packCount: "2", unitQty: "", unit: dim.defaultInputUnit, promoType: "原價", storeManuallySet: false };
      uiState.pk.b = { store: appState.activeStore, price: "", isMultiPack: false, packCount: "2", unitQty: "", unit: dim.defaultInputUnit, promoType: "原價", storeManuallySet: false };
      renderPkView();
      showToast("🔄 已清空 PK 欄位", "info");
    }

    /** 貨架 PK 轉存至比價庫彈窗 */
    function openPkSaveModal() {
      const dimId = uiState.pk.dimension;
      const mA = calculateQuoteMetrics(dimId, buildPkSideQuote("a"));
      const mB = calculateQuoteMetrics(dimId, buildPkSideQuote("b"));

      if (!mA.valid && !mB.valid) {
        showToast("請至少完整輸入一筆商品的價格與規格再轉存", "warning");
        return;
      }

      const sameDimProducts = appState.products.filter(p => p.dimension === dimId);
      const bothValid = mA.valid && mB.valid;
      let defaultSaveOption = bothValid ? "both" : (mA.valid ? "a" : "b");

      openModal({
        title: "💾 轉存至比價庫",
        bodyHtml: `
          <div class="stack">
            <div>
              <label class="field-label">選擇要存入的項目</label>
              <div class="grid-3">
                <label class="multipack-toggle-card" style="padding: 8px; justify-content: center; opacity: ${mA.valid ? 1 : 0.45};">
                  <input type="radio" name="pk-save-which" value="a" ${defaultSaveOption === "a" ? "checked" : ""} ${mA.valid ? "" : "disabled"} style="width:16px; height:16px;" />
                  <span class="text-xs font-bold">只存 A</span>
                </label>
                <label class="multipack-toggle-card" style="padding: 8px; justify-content: center; opacity: ${mB.valid ? 1 : 0.45};">
                  <input type="radio" name="pk-save-which" value="b" ${defaultSaveOption === "b" ? "checked" : ""} ${mB.valid ? "" : "disabled"} style="width:16px; height:16px;" />
                  <span class="text-xs font-bold">只存 B</span>
                </label>
                <label class="multipack-toggle-card" style="padding: 8px; justify-content: center; opacity: ${bothValid ? 1 : 0.45};">
                  <input type="radio" name="pk-save-which" value="both" ${defaultSaveOption === "both" ? "checked" : ""} ${bothValid ? "" : "disabled"} style="width:16px; height:16px;" />
                  <span class="text-xs font-bold">A、B 都存</span>
                </label>
              </div>
            </div>

            <div>
              <label class="field-label">存入目標</label>
              <div class="grid-2" style="margin-bottom: 10px;">
                <button type="button" id="pks-tab-new" class="seg-btn active" onclick="togglePkSaveTarget('new')">➕ 建立新商品</button>
                <button type="button" id="pks-tab-existing" class="seg-btn" ${sameDimProducts.length === 0 ? "disabled style='opacity:0.45;'" : ""} onclick="togglePkSaveTarget('existing')">📦 存入既有 (${sameDimProducts.length})</button>
              </div>
              <input type="hidden" id="pks-target-mode" value="new" />

              <div id="pks-new-fields" class="stack-sm" style="padding: 12px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--border);">
                <div>
                  <label class="field-label">新商品名稱<span class="req">*</span></label>
                  <input id="pks-new-name" type="text" class="input input-bold" placeholder="例如：好市多鮮乳、桂格大燕麥片" />
                </div>
                <div class="grid-2">
                  <div>
                    <label class="field-label">品牌（選填）</label>
                    <input id="pks-new-brand" type="text" class="input" placeholder="品牌名" />
                  </div>
                  <div>
                    <label class="field-label">分類</label>
                    <select id="pks-new-cat" class="select">
                      ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("")}
                    </select>
                  </div>
                </div>
                <div>
                  <label class="field-label">比價群組（選填）</label>
                  <input id="pks-new-group" type="text" class="input" placeholder="例如：#全脂鮮乳" />
                </div>
              </div>

              <div id="pks-existing-fields" class="hidden" style="padding: 12px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--border);">
                <label class="field-label">選擇既有${getDimensionConfig(dimId).label}商品</label>
                <select id="pks-existing-id" class="select">
                  ${sameDimProducts.map(p => `<option value="${p.id}">${escapeHtml(p.name)}${p.brand ? ` (${escapeHtml(p.brand)})` : ""}</option>`).join("")}
                </select>
              </div>
            </div>
          </div>
        `,
        footerHtml: `
          <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="confirmPkSaveToLibrary()">💾 確認轉存</button>
        `
      });
    }

    function togglePkSaveTarget(mode) {
      document.getElementById("pks-target-mode").value = mode;
      const isNew = mode === "new";
      document.getElementById("pks-new-fields")?.classList.toggle("hidden", !isNew);
      document.getElementById("pks-existing-fields")?.classList.toggle("hidden", isNew);
      document.getElementById("pks-tab-new")?.classList.toggle("active", isNew);
      document.getElementById("pks-tab-existing")?.classList.toggle("active", !isNew);
    }

    function confirmPkSaveToLibrary() {
      const mode = document.getElementById("pks-target-mode")?.value || "new";
      const saveWhich = document.querySelector('input[name="pk-save-which"]:checked')?.value || "both";
      const dimId = uiState.pk.dimension;

      let targetProd = null;
      if (mode === "new") {
        const name = (document.getElementById("pks-new-name")?.value || "").trim();
        if (!name) {
          showToast("請輸入新商品名稱", "warning");
          document.getElementById("pks-new-name")?.focus();
          return;
        }
        targetProd = {
          id: generateId("prod"),
          name,
          brand: (document.getElementById("pks-new-brand")?.value || "").trim(),
          category: document.getElementById("pks-new-cat")?.value || CATEGORIES[0],
          groupTag: normalizeGroupTag(document.getElementById("pks-new-group")?.value || ""),
          dimension: dimId,
          displayUnit: uiState.pk.displayUnit,
          quotes: []
        };
        appState.products.unshift(targetProd);
      } else {
        const prodId = document.getElementById("pks-existing-id")?.value;
        targetProd = appState.products.find(p => p.id === prodId);
        if (!targetProd) {
          showToast("找不到目標商品", "error");
          return;
        }
      }

      const sides = saveWhich === "both" ? ["a", "b"] : [saveWhich];
      let savedCount = 0;

      sides.forEach(side => {
        const qObj = buildPkSideQuote(side);
        const m = calculateQuoteMetrics(dimId, qObj);
        if (m.valid) {
          targetProd.quotes.push({
            id: generateId("q"),
            store: qObj.store || appState.activeStore,
            price: m.price,
            packCount: m.packCount,
            unitQty: m.unitQty,
            unit: qObj.unit,
            promoType: qObj.promoType || "原價",
            checkDate: uiState.todayDate,
            note: "由貨架即時 PK 轉存",
            isReferenceOnly: false,
            refUnitText: ""
          });
          savedCount++;
        }
      });

      saveData();
      closeModal();
      uiState.activeTab = "library";
      renderBottomNav();
      openProductDetail(targetProd.id);
      showToast(`✅ 已轉存 ${savedCount} 筆報價至「${targetProd.name}」`, "success");
    }

    /*************************************************************************
     * 十三、分頁三：📊 報表與管理（Excel 3工作表、JSON 備份還原、賣場管理）
     *************************************************************************/
    function renderManageView() {
      const main = document.getElementById("main-container");
      const totalProducts = appState.products.length;
      const totalQuotes = appState.products.reduce((s, p) => s + p.quotes.length, 0);
      const usedStores = new Set();
      appState.products.forEach(p => p.quotes.forEach(q => usedStores.add(q.store)));

      main.innerHTML = `
        <div class="stack">
          <!-- 統計儀表板 -->
          <div class="grid-3">
            <div class="stat-card">
              <div class="stat-val text-primary">${totalProducts}</div>
              <div class="stat-label">商品總數</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">${totalQuotes}</div>
              <div class="stat-label">報價紀錄數</div>
            </div>
            <div class="stat-card">
              <div class="stat-val" style="color: var(--sky);">${usedStores.size}</div>
              <div class="stat-label">已記錄賣場數</div>
            </div>
          </div>

          <!-- 1. Excel 三工作表報表匯出 -->
          <div class="card stack-sm">
            <div style="font-size: 15px; font-weight: 900;">📥 匯出 Excel 報表（.xlsx 三工作表）</div>
            <p class="text-xs text-muted" style="margin: 0; line-height: 1.55;">
              一鍵產出包含「1_各商品最低價總覽表」、「2_完整賣場報價明細表」與「3_各賣場最划算採購清單」三個工作表的標準 Excel 檔。
            </p>
            <button type="button" class="btn btn-primary btn-full" onclick="exportExcelReport()">📊 匯出 Excel 報表 (.xlsx)</button>
          </div>

          <!-- 2. JSON 備份與還原 -->
          <div class="card stack-sm">
            <div style="font-size: 15px; font-weight: 900;">💾 JSON 備份與還原</div>
            <p class="text-xs text-muted" style="margin: 0; line-height: 1.5;">
              建議定期匯出 JSON 存於手機檔案夾，換手機或升級改版時可一鍵覆蓋或合併還原，雙重保障資料安全。
            </p>
            <div class="grid-2">
              <button type="button" class="btn btn-dark btn-sm" style="padding: 11px;" onclick="exportJsonBackup()">💾 匯出 JSON 備份</button>
              <button type="button" class="btn btn-emerald-soft btn-sm" style="padding: 11px;" onclick="document.getElementById('json-import-file').click()">📂 匯入 JSON 還原</button>
            </div>
          </div>

          <!-- 3. 賣場清單管理 -->
          <div class="card stack-sm">
            <div class="row-between">
              <div style="font-size: 15px; font-weight: 900;">🏪 賣場清單管理</div>
              <button type="button" class="btn btn-emerald-soft btn-xs" onclick="openAddStoreModal()">＋ 新增賣場</button>
            </div>

            <div>
              <div class="text-xxs font-bold text-muted" style="margin-bottom: 6px;">預設 9 大賣場</div>
              <div class="row-wrap">
                ${DEFAULT_STORES.map(s => `<span class="badge badge-pill badge-slate" style="padding: 4px 10px;">${escapeHtml(s)}</span>`).join("")}
              </div>
            </div>

            <div style="padding-top: 8px; border-top: 1px solid var(--border);">
              <div class="text-xxs font-bold text-muted" style="margin-bottom: 6px;">自訂賣場（${appState.customStores.length}）</div>
              ${appState.customStores.length > 0 ? `
                <div class="row-wrap">
                  ${appState.customStores.map(s => `
                    <span class="badge badge-pill badge-emerald" style="padding: 4px 6px 4px 11px; gap: 6px;">
                      <span>${escapeHtml(s)}</span>
                      <button type="button" onclick="confirmDeleteCustomStore('${escapeHtml(s).replace(/'/g, "\\'")}')" style="width:18px; height:18px; border-radius:999px; background:#fff; color:var(--rose); font-size:10px; font-weight:900; display:inline-flex; align-items:center; justify-content:center;">✕</button>
                    </span>
                  `).join("")}
                </div>
              ` : `<div class="text-xs text-muted">尚未新增任何自訂賣場</div>`}
            </div>
          </div>

          <!-- 4. 範例資料與系統重置 -->
          <div class="card stack-sm">
            <div style="font-size: 15px; font-weight: 900;">⚙️ 範例資料與重置</div>
            <div class="grid-2">
              <button type="button" class="btn btn-amber-soft btn-sm" style="padding: 11px;" onclick="confirmResetSampleData()">🧪 還原內建範例</button>
              <button type="button" class="btn btn-rose-soft btn-sm" style="padding: 11px;" onclick="confirmClearAllData()">🗑️ 清空全部資料</button>
            </div>
            <div class="text-xxs text-muted" style="padding-top: 4px;">
              版本：行動賣場商品比價系統 ${APP_VERSION}（純觸控極速版）｜本地鍵值：${STORAGE_KEY}
            </div>
          </div>
        </div>
      `;
    }

    function confirmDeleteCustomStore(storeName) {
      openConfirmModal({
        title: "🗑️ 移除自訂賣場",
        message: `確定要從快速切換列移除「${storeName}」嗎？\n（已記錄在商品中的歷史報價仍會完整保留）`,
        confirmText: "確定移除",
        onConfirm: () => {
          appState.customStores = appState.customStores.filter(s => s !== storeName);
          if (appState.activeStore === storeName) appState.activeStore = DEFAULT_STORES[0];
          saveData();
          renderStoreBar();
          renderManageView();
          showToast(`🗑️ 已移除自訂賣場「${storeName}」`, "info");
        }
      });
    }

    function confirmResetSampleData() {
      openConfirmModal({
        title: "🧪 還原為內建示範資料",
        message: "此操作將覆蓋目前所有商品與報價，還原為系統內建的 4 筆示範資料（馬鈴薯、義美／瑞穗鮮乳、舒潔衛生紙）。\n\n建議先匯出 JSON 備份，確定要還原嗎？",
        confirmText: "確定還原範例",
        confirmBtnClass: "btn-amber",
        onConfirm: () => {
          appState.products = createDemoProducts();
          uiState.selectedProductId = null;
          saveData();
          renderManageView();
          showToast("🧪 已還原 4 筆內建示範資料", "success");
        }
      });
    }

    function confirmClearAllData() {
      openConfirmModal({
        title: "🗑️ 清空全部資料",
        message: "這將刪除目前全部商品與報價，讓您從空白比價庫正式開始累積資料。\n\n重新整理網頁後不會再載入示範資料。確定要清空嗎？",
        confirmText: "確定清空",
        onConfirm: () => {
          appState.products = [];
          uiState.selectedProductId = null;
          saveData();
          renderManageView();
          showToast("🗑️ 已清空全部商品資料", "info");
        }
      });
    }

    /*************************************************************************
     * 十四、Excel 三工作表匯出與 JSON 備份／還原引擎
     *************************************************************************/
    function exportExcelReport() {
      if (typeof XLSX === "undefined") {
        showToast("⚠️ 離線狀態無法載入 Excel 元件，請先使用「匯出 JSON 備份」", "warning");
        return;
      }
      if (appState.products.length === 0) {
        showToast("目前沒有商品資料可匯出", "warning");
        return;
      }

      try {
        const sheet1 = [];
        const sheet2 = [];
        const sheet3 = [];

        appState.products.forEach(p => {
          const dim = getDimensionConfig(p.dimension);
          const stats = analyzeProductQuotes(p);
          const best = stats.bestQuote;
          const second = stats.secondQuote;

          const bestPrice = best ? getDisplayPrice(p.dimension, p.displayUnit, best.baseUnitPrice) : null;
          const secondPrice = second ? getDisplayPrice(p.dimension, p.displayUnit, second.baseUnitPrice) : null;
          const bestUnitText = best
            ? `元/${getEffectiveUnitSuffix(p.dimension, p.displayUnit, best.unit)}`
            : getDisplayUnitConfig(p.dimension, p.displayUnit).label;

          const savePct = (best && second && second.baseUnitPrice > 0)
            ? `${(((second.baseUnitPrice - best.baseUnitPrice) / second.baseUnitPrice) * 100).toFixed(1)}%`
            : "-";

          sheet1.push({
            "商品名稱": p.name,
            "品牌": p.brand || "",
            "分類": p.category,
            "比價群組": p.groupTag || "",
            "計價方式": dim.label,
            "顯示基準單位": bestUnitText,
            "歷史最便宜賣場": best ? best.store : "尚無換算報價",
            "最低基準單價": bestPrice !== null ? Number(formatUnitPrice(bestPrice)) : "",
            "最低價原始規格": best ? formatHumanSpec(p.dimension, best) : "",
            "促銷類型": best ? best.promoType : "",
            "查價日期": best ? best.checkDate : "",
            "次便宜賣場": second ? second.store : "-",
            "次便宜基準單價": secondPrice !== null ? Number(formatUnitPrice(secondPrice)) : "",
            "最便宜省下": savePct,
            "總報價筆數": stats.totalCount
          });

          [...stats.ranked, ...stats.references].forEach(q => {
            const dispVal = q.baseUnitPrice ? getDisplayPrice(p.dimension, p.displayUnit, q.baseUnitPrice) : null;
            const fresh = getFreshnessInfo(q.checkDate);
            const uLabel = q.isReferenceOnly ? (q.refUnitText || "份") : getInputUnitConfig(p.dimension, q.unit).label;
            const qUnitText = q.isReferenceOnly ? "-" : `元/${getEffectiveUnitSuffix(p.dimension, p.displayUnit, q.unit)}`;

            sheet2.push({
              "商品名稱": p.name,
              "品牌": p.brand || "",
              "分類": p.category,
              "比價群組": p.groupTag || "",
              "賣場名稱": q.store,
              "價格類型": q.promoType,
              "價格(元)": q.price,
              "組數/入數": q.packCount || 1,
              "單件數量/重量/容量": q.unitQty,
              "單位": uLabel,
              "參考報價": q.isReferenceOnly ? "是" : "否",
              "換算基準單價": dispVal !== null ? Number(formatUnitPrice(dispVal)) : "",
              "基準單位": qUnitText,
              "名次": q.priceRank ? `#${q.priceRank}` : "參考",
              "查價日期": q.checkDate,
              "距今天數": fresh.days,
              "新鮮度": fresh.statusText,
              "備註": q.note || ""
            });
          });

          if (best) {
            sheet3.push({
              "最划算賣場": best.store,
              "商品名稱": p.name,
              "品牌": p.brand || "",
              "分類": p.category,
              "最低基準單價": Number(formatUnitPrice(bestPrice)),
              "基準單位": bestUnitText,
              "原始價格與規格": formatHumanSpec(p.dimension, best),
              "價格類型": best.promoType,
              "比次便宜省下": savePct,
              "查價日期": best.checkDate,
              "備註": best.note || ""
            });
          }
        });

        sheet3.sort((a, b) => a["最划算賣場"].localeCompare(b["最划算賣場"], "zh-Hant"));

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet1), "1_各商品最低價總覽表");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet2.length ? sheet2 : [{ "說明": "尚無報價明細" }]), "2_完整賣場報價明細表");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet3.length ? sheet3 : [{ "說明": "尚無採購清單" }]), "3_各賣場最划算採購清單");

        const fileName = `行動比價報表_${uiState.todayDate}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast(`✅ 已匯出 Excel：${fileName}`, "success");
      } catch (err) {
        console.error("Excel 匯出錯誤:", err);
        showToast("⚠️ 匯出 Excel 失敗，請改試 JSON 備份", "error");
      }
    }

    function exportJsonBackup() {
      try {
        const exportObj = {
          ...appState,
          exportedAt: new Date().toISOString(),
          storageKey: STORAGE_KEY
        };
        const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const fileName = `smart_price_backup_${uiState.todayDate}.json`;
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`💾 已匯出備份：${fileName}`, "success");
      } catch (err) {
        console.error("JSON 匯出錯誤:", err);
        showToast("⚠️ 匯出 JSON 失敗", "error");
      }
    }

    function handleJsonFileSelect(event) {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || !Array.isArray(data.products)) {
            showToast("⚠️ 無效的 JSON 備份格式", "error");
            return;
          }
          pendingJsonImportData = data;
          const totalQ = data.products.reduce((s, p) => s + (Array.isArray(p.quotes) ? p.quotes.length : 0), 0);

          openModal({
            title: "📂 選擇 JSON 還原模式",
            bodyHtml: `
              <div class="stack-sm">
                <div class="card" style="background: #f8fafc; padding: 12px;">
                  <div class="text-xs font-black">備份檔案內容摘要：</div>
                  <div class="text-xs" style="margin-top: 5px;">📦 商品數量：<strong>${data.products.length}</strong> 項</div>
                  <div class="text-xs" style="margin-top: 2px;">📋 報價紀錄：<strong>${totalQ}</strong> 筆</div>
                </div>
                <p class="text-xs text-muted" style="margin: 0;">請選擇要「合併匯入」現有資料庫，或是「覆蓋還原」整份備份：</p>
              </div>
            `,
            footerHtml: `
              <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">取消</button>
              <button type="button" class="btn btn-primary btn-sm" onclick="applyJsonImport('merge')">🔀 合併匯入</button>
              <button type="button" class="btn btn-danger btn-sm" onclick="applyJsonImport('overwrite')">♻️ 覆蓋還原</button>
            `
          });
        } catch (err) {
          showToast("⚠️ 無法解析 JSON 檔案", "error");
        }
      };
      reader.readAsText(file);
    }

    function applyJsonImport(mode) {
      if (!pendingJsonImportData) return;
      const incoming = pendingJsonImportData;
      pendingJsonImportData = null;

      const incomingStores = Array.isArray(incoming.customStores) ? incoming.customStores : [];
      incoming.products.forEach(migrateProductSchema);

      if (mode === "overwrite") {
        appState.customStores = incomingStores.filter(s => !DEFAULT_STORES.includes(s));
        appState.products = incoming.products;
        if (incoming.activeStore && getAllStores().includes(incoming.activeStore)) {
          appState.activeStore = incoming.activeStore;
        }
        saveData();
        closeModal();
        renderStoreBar();
        renderManageView();
        showToast(`♻️ 已覆蓋還原 ${appState.products.length} 項商品`, "success");
      } else {
        incomingStores.forEach(s => {
          if (!DEFAULT_STORES.includes(s) && !appState.customStores.includes(s)) {
            appState.customStores.push(s);
          }
        });

        let addedProducts = 0;
        let addedQuotes = 0;

        incoming.products.forEach(impProd => {
          const existing = appState.products.find(
            p => p.id === impProd.id || (p.name === impProd.name && p.dimension === impProd.dimension)
          );
          if (!existing) {
            appState.products.push(impProd);
            addedProducts++;
            addedQuotes += (impProd.quotes || []).length;
          } else {
            (impProd.quotes || []).forEach(iq => {
              const dup = existing.quotes.some(
                eq => eq.id === iq.id || (eq.store === iq.store && eq.price === iq.price && eq.packCount === iq.packCount && eq.unitQty === iq.unitQty && eq.unit === iq.unit && eq.checkDate === iq.checkDate)
              );
              if (!dup) {
                existing.quotes.push(iq);
                addedQuotes++;
              }
            });
          }
        });

        saveData();
        closeModal();
        renderStoreBar();
        renderManageView();
        showToast(`🔀 合併完成：新增 ${addedProducts} 項商品、${addedQuotes} 筆報價`, "success");
      }
    }

    /*************************************************************************
     * 十五、系統初始化與跨日背景喚醒事件監聽
     *************************************************************************/
    function initApp() {
      const badge = document.getElementById("app-version-badge");
      if (badge) badge.textContent = APP_VERSION;

      checkAndAutoSyncRealDate(false);
      loadData();

      uiState.pk.a.store = appState.activeStore;
      uiState.pk.b.store = appState.activeStore;

      renderStoreBar();
      renderBottomNav();
      renderMainContent();

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") checkAndAutoSyncRealDate(true);
      });
      window.addEventListener("pageshow", () => checkAndAutoSyncRealDate(true));
      window.addEventListener("focus", () => checkAndAutoSyncRealDate(true));
    }

    window.addEventListener("DOMContentLoaded", initApp);
  </script>
