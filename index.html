                  value="${escapeHtml(uiState.searchQuery)}"
                  oninput="handleLibrarySearch(this.value)"
                  placeholder="搜尋品名、品牌或 #群組..."
                />
                <button
                  id="library-search-clear"
                  type="button"
                  class="search-clear ${uiState.searchQuery ? "" : "hidden"}"
                  onclick="clearLibrarySearch()"
                >✕</button>
              </div>
              <button type="button" class="btn btn-primary btn-sm" style="padding: 10px 13px;" onclick="openProductModal()">➕ 新增商品</button>
            </div>

            <div class="cat-pills no-scrollbar">
              ${allCats.map(cat => `
                <button
                  type="button"
                  class="cat-pill ${uiState.selectedCategory === cat ? "active" : ""}"
                  onclick="selectLibraryCategory('${cat}')"
                >${cat}</button>
              `).join("")}
            </div>
          </div>

          <div id="library-list-body" class="stack-sm"></div>
        </div>
      `;

      renderLibraryListItems();
    }

    function renderLibraryListItems() {
      const container = document.getElementById("library-list-body");
      if (!container) return;

      const products = getFilteredProducts();
      const q = (uiState.searchQuery || "").trim();
      const hasExactMatch = q && appState.products.some(p => (p.name || "").trim().toLowerCase() === q.toLowerCase());

      let html = "";

      // 若有搜尋詞且無完全同名商品，頂部提供快捷建立鈕
      if (q && !hasExactMatch && products.length > 0) {
        html += `
          <button
            type="button"
            class="btn btn-emerald-soft btn-full"
            style="justify-content: space-between; padding: 10px 14px; font-size: 13px;"
            onclick="openProductModal(null, '${escapeHtml(q).replace(/'/g, "\\'")}')"
          >
            <span>➕ 直接建立新商品「${escapeHtml(q)}」</span>
            <span>→</span>
          </button>
        `;
      }

      if (products.length === 0) {
        html += `
          <div class="card text-center stack-sm" style="padding: 28px 16px;">
            <div style="font-size: 38px;">🛒</div>
            <div style="font-size: 15px; font-weight: 800; color: #334155;">
              ${q ? `找不到「${escapeHtml(q)}」的比價資料` : "目前尚無比價商品"}
            </div>
            <div class="text-xs text-muted">
              ${q ? "點擊下方按鈕立即建立商品並記錄價格" : "點擊下方按鈕建立您的第一項比價商品"}
            </div>
            <div style="padding-top: 6px;">
              <button
                type="button"
                class="btn btn-primary"
                onclick="openProductModal(null, '${escapeHtml(q).replace(/'/g, "\\'")}')"
              >➕ ${q ? `直接建立新商品「${escapeHtml(q)}」` : "建立新商品"}</button>
            </div>
          </div>
        `;
        container.innerHTML = html;
        return;
      }

      html += products.map(p => {
        const dim = getDimensionConfig(p.dimension);
        const stats = analyzeProductQuotes(p);
        const best = stats.bestQuote;
        const bestVal = best ? getDisplayPrice(p.dimension, p.displayUnit, best.baseUnitPrice) : null;
        const unitSuffix = best ? getEffectiveUnitSuffix(p.dimension, p.displayUnit, best.unit) : getDisplayUnitConfig(p.dimension, p.displayUnit).unitText;
        const fresh = stats.latestDate ? getFreshnessInfo(stats.latestDate) : null;

        return `
          <div class="card card-clickable" onclick="openProductDetail('${p.id}')">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
              <div style="min-width: 0; flex: 1;">
                <div class="row-wrap">
                  <h3 class="prod-name">${escapeHtml(p.name)}</h3>
                  ${p.brand ? `<span class="badge badge-slate">${escapeHtml(p.brand)}</span>` : ""}
                </div>
                <div class="row-wrap" style="margin-top: 6px;">
                  <span class="badge badge-emerald">${escapeHtml(p.category)}</span>
                  <span class="badge badge-slate">${dim.icon} ${dim.label}</span>
                  ${p.groupTag ? `<span class="badge badge-sky">${escapeHtml(p.groupTag)}</span>` : ""}
                </div>
              </div>

              <div class="text-right" style="flex-shrink: 0;">
                ${best ? `
                  <div style="margin-bottom: 4px;">
                    <span class="badge badge-pill badge-winner-soft">🏆 ${escapeHtml(best.store)}</span>
                  </div>
                  <div class="price-figure text-primary">$${formatUnitPrice(bestVal)}</div>
                  <div class="text-xxs text-muted font-bold" style="margin-top: 2px;">每 ${escapeHtml(unitSuffix)}</div>
                ` : `
                  <span class="badge badge-slate" style="padding: 6px 10px;">尚無換算價</span>
                `}
              </div>
            </div>

            <div class="card-footer-bar text-xxs text-muted">
              <div class="row" style="min-width: 0; flex: 1;">
                <span class="font-bold text-sub" style="flex-shrink:0;">📋 ${stats.totalCount} 筆報價</span>
                ${best ? `<span class="truncate">${escapeHtml(formatHumanSpec(p.dimension, best))}</span>` : ""}
              </div>
              <div class="row" style="flex-shrink: 0; gap: 5px;">
                ${stats.latestDate ? `
                  <span>📅 ${stats.latestDate}</span>
                  ${fresh ? `<span class="badge badge-pill ${fresh.badgeClass}" style="font-size:10px; padding:1px 6px;">${fresh.label}</span>` : ""}
                ` : `<span>點擊記價 →</span>`}
              </div>
            </div>
          </div>
        `;
      }).join("");

      container.innerHTML = html;
    }

    function handleLibrarySearch(val) {
      uiState.searchQuery = val;
      document.getElementById("library-search-clear")?.classList.toggle("hidden", !val);
      renderLibraryListItems();
    }

    function clearLibrarySearch() {
      uiState.searchQuery = "";
      const input = document.getElementById("library-search-input");
      if (input) {
        input.value = "";
        input.focus();
      }
      document.getElementById("library-search-clear")?.classList.add("hidden");
      renderLibraryListItems();
    }

    function selectLibraryCategory(cat) {
      uiState.selectedCategory = cat;
      renderLibraryList();
    }

    function openProductDetail(productId) {
      uiState.selectedProductId = productId;
      uiState.editingQuoteId = null;
      uiState.showGroupRankingPanel = false;
      const prod = appState.products.find(p => p.id === productId);
      uiState.showQuoteForm = prod && prod.quotes.length === 0;
      renderProductDetail();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function backToLibraryList() {
      uiState.selectedProductId = null;
      uiState.showQuoteForm = false;
      uiState.editingQuoteId = null;
      renderLibraryList();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    /*************************************************************************
     * 十、分頁一（B）：商品詳情頁（v1.1 直覺白話表單 + 跨品牌排行 + 單位切換）
     *************************************************************************/
    function getCurrentProduct() {
      return appState.products.find(p => p.id === uiState.selectedProductId) || null;
    }

    function renderProductDetail() {
      const p = getCurrentProduct();
      if (!p) {
        backToLibraryList();
        return;
      }

      const main = document.getElementById("main-container");
      const dim = getDimensionConfig(p.dimension);
      const stats = analyzeProductQuotes(p);
      const best = stats.bestQuote;
      const bestVal = best ? getDisplayPrice(p.dimension, p.displayUnit, best.baseUnitPrice) : null;
      const bestUnitSuffix = best ? getEffectiveUnitSuffix(p.dimension, p.displayUnit, best.unit) : getDisplayUnitConfig(p.dimension, p.displayUnit).unitText;
      const uniformCountUnit = detectUniformCountUnit(p);

      // 收集同群組跨品牌商品與綜合排行榜資料
      const groupPeers = p.groupTag
        ? appState.products.filter(item => item.groupTag && item.groupTag === p.groupTag)
        : [];

      let groupCombinedRanking = [];
      if (groupPeers.length > 1) {
        groupPeers.forEach(peer => {
          if (peer.dimension !== p.dimension) return;
          const peerStats = analyzeProductQuotes(peer);
          peerStats.ranked.forEach(q => {
            groupCombinedRanking.push({
              productId: peer.id,
              productName: peer.name,
              brand: peer.brand,
              quote: q,
              baseUnitPrice: q.baseUnitPrice
            });
          });
        });
        groupCombinedRanking.sort((a, b) => a.baseUnitPrice - b.baseUnitPrice);
      }
      const groupLowestBase = groupCombinedRanking.length > 0 ? groupCombinedRanking[0].baseUnitPrice : Infinity;

      // 報價排序
      const displayRanked = stats.ranked.slice();
      if (uiState.quoteSort === "date") {
        displayRanked.sort((a, b) => {
          const cmp = (b.checkDate || "").localeCompare(a.checkDate || "");
          return cmp !== 0 ? cmp : a.baseUnitPrice - b.baseUnitPrice;
        });
      }

      const editingQuote = uiState.editingQuoteId
        ? p.quotes.find(q => q.id === uiState.editingQuoteId) || null
        : null;

      main.innerHTML = `
        <div class="stack">
          <!-- 1. 商品頂部資訊與跨品牌群組比價列 -->
          <div class="card">
            <div class="row-between" style="margin-bottom: 10px;">
              <button type="button" class="btn btn-soft btn-sm" onclick="backToLibraryList()">← 返回清單</button>
              <div class="row" style="gap: 6px;">
                <button type="button" class="btn btn-soft btn-sm" onclick="openProductModal('${p.id}')">✏️ 編輯</button>
                <button type="button" class="btn btn-rose-soft btn-sm" onclick="confirmDeleteProduct('${p.id}')">🗑️</button>
              </div>
            </div>

            <div class="row-wrap">
              <h2 style="margin: 0; font-size: 20px; font-weight: 900; line-height: 1.25;">${escapeHtml(p.name)}</h2>
              ${p.brand ? `<span class="badge badge-slate">${escapeHtml(p.brand)}</span>` : ""}
            </div>
            <div class="row-wrap" style="margin-top: 6px;">
              <span class="badge badge-emerald">${escapeHtml(p.category)}</span>
              <span class="badge badge-slate">${dim.icon} ${dim.label}</span>
              ${p.groupTag ? `<span class="badge badge-sky">${escapeHtml(p.groupTag)}</span>` : ""}
            </div>

            ${groupPeers.length > 1 ? `
              <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);">
                <div class="row-between" style="margin-bottom: 7px;">
                  <span class="text-xxs font-black" style="color: #0369a1;">🔗 同群組跨品牌比價（${escapeHtml(p.groupTag)}）</span>
                  ${groupCombinedRanking.length > 0 ? `
                    <button type="button" class="btn btn-sky-soft btn-xs" onclick="toggleGroupRankingPanel()">
                      ${uiState.showGroupRankingPanel ? "收合總排行 ▲" : "📊 跨品牌總排行 ▼"}
                    </button>
                  ` : ""}
                </div>

                <!-- 快速切換膠囊 -->
                <div class="store-pills no-scrollbar">
                  ${groupPeers.map(peer => {
                    const isSelf = peer.id === p.id;
                    const peerBest = analyzeProductQuotes(peer).bestQuote;
                    const sameDim = peer.dimension === p.dimension;
                    const dispUnitId = sameDim ? p.displayUnit : peer.displayUnit;
                    const peerVal = peerBest ? getDisplayPrice(peer.dimension, dispUnitId, peerBest.baseUnitPrice) : null;
                    const peerSuffix = peerBest ? getEffectiveUnitSuffix(peer.dimension, dispUnitId, peerBest.unit) : "";
                    const isWinner = sameDim && peerBest && Math.abs(peerBest.baseUnitPrice - groupLowestBase) < 1e-9;
                    return `
                      <button
                        type="button"
                        onclick="openProductDetail('${peer.id}')"
                        class="store-pill"
                        style="${isSelf
                          ? "background:#0284c7; border-color:#0284c7; color:#fff;"
                          : "background:#f0f9ff; border-color:#bae6fd; color:#0c4a6e;"}"
                      >
                        ${isWinner ? "🏆 " : ""}${escapeHtml(peer.name)}
                        ${peerVal !== null ? ` · $${formatUnitPrice(peerVal)}/${escapeHtml(peerSuffix)}` : ""}
                      </button>
                    `;
                  }).join("")}
                </div>

                <!-- 跨品牌綜合排行榜面板 -->
                ${uiState.showGroupRankingPanel && groupCombinedRanking.length > 0 ? `
                  <div class="group-rank-panel">
                    ${groupCombinedRanking.map((row, idx) => {
                      const val = getDisplayPrice(p.dimension, p.displayUnit, row.baseUnitPrice);
                      const suf = getEffectiveUnitSuffix(p.dimension, p.displayUnit, row.quote.unit);
                      const diffPct = groupLowestBase > 0 ? ((row.baseUnitPrice - groupLowestBase) / groupLowestBase) * 100 : 0;
                      const isTop = idx === 0 || diffPct < 0.05;
                      return `
                        <div class="group-rank-row ${isTop ? "is-top" : ""} ${row.productId === p.id ? "is-current" : ""}" onclick="openProductDetail('${row.productId}')">
                          <div style="min-width: 0; flex: 1;">
                            <div class="row-wrap" style="gap: 4px;">
                              <span class="badge ${isTop ? "badge-winner" : "badge-slate"}" style="font-size:10px;">${isTop ? "🏆 #1" : `#${idx + 1}`}</span>
                              <strong style="color:#0f172a;">${escapeHtml(row.productName)}</strong>
                              <span class="badge badge-emerald" style="font-size:10px;">${escapeHtml(row.quote.store)}</span>
                            </div>
                            <div class="text-xxs text-muted" style="margin-top: 2px;">${escapeHtml(formatHumanSpec(p.dimension, row.quote))}</div>
                          </div>
                          <div class="text-right" style="flex-shrink: 0;">
                            <div style="font-size: 14px; font-weight: 900; color: ${isTop ? "#16a34a" : "#0f172a"};">$${formatUnitPrice(val)}<span class="text-xxs text-muted">/${escapeHtml(suf)}</span></div>
                            <div class="text-xxs font-bold" style="color: ${isTop ? "#16a34a" : "#64748b"};">${isTop ? "群組最省" : `+${diffPct.toFixed(1)}%`}</div>
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                ` : ""}
              </div>
            ` : ""}
          </div>

          <!-- 2. ⚖️ 一鍵切換顯示基準單位 -->
          <div class="card" style="padding: 12px;">
            <div class="row-between" style="margin-bottom: 8px;">
              <span class="text-xs font-black">⚖️ 一鍵切換顯示單位</span>
              <span class="text-xxs text-muted">點擊即時重算全部價格</span>
            </div>
            <div class="seg-grid" style="grid-template-columns: repeat(${dim.displayUnits.length}, minmax(0, 1fr));">
              ${dim.displayUnits.map(du => {
                let btnLabel = du.label;
                if (p.dimension === "count" && uniformCountUnit) {
                  btnLabel = du.multiplier === 100 ? `元/100${uniformCountUnit}` : `元/1${uniformCountUnit}`;
                }
                return `
                  <button
                    type="button"
                    class="seg-btn ${p.displayUnit === du.id ? "active" : ""}"
                    onclick="switchProductDisplayUnit('${p.id}', '${du.id}')"
                  >${escapeHtml(btnLabel)}</button>
                `;
              }).join("")}
            </div>
          </div>

          <!-- 3. 🏆 歷史最低價看板 -->
          ${best ? `
            <div class="hero-banner">
              <div class="row-between">
                <span class="badge badge-pill" style="background: rgba(255,255,255,0.22); color: #fff; font-weight: 800;">🏆 歷史最低價</span>
                <span class="hero-sub">📅 ${escapeHtml(best.checkDate)}</span>
              </div>
              <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 10px;">
                <div style="min-width: 0;">
                  <div style="font-size: 16px; font-weight: 900;">
                    ${escapeHtml(best.store)}
                    <span class="badge" style="background: rgba(0,0,0,0.2); color: #ecfdf5; margin-left: 4px;">${escapeHtml(getPromoConfig(best.promoType).label)}</span>
                  </div>
                  <div class="hero-sub" style="margin-top: 4px;">${escapeHtml(formatHumanSpec(p.dimension, best))}</div>
                </div>
                <div class="text-right" style="flex-shrink: 0;">
                  <div class="hero-price">$${formatUnitPrice(bestVal)}</div>
                  <div class="hero-sub" style="margin-top: 3px;">每 ${escapeHtml(bestUnitSuffix)}</div>
                </div>
              </div>
              ${stats.secondQuote ? (() => {
                const savePct = ((stats.secondQuote.baseUnitPrice - best.baseUnitPrice) / stats.secondQuote.baseUnitPrice) * 100;
                return savePct >= 0.1
                  ? `<div class="hero-divider">💡 比第二便宜（${escapeHtml(stats.secondQuote.store)}）再便宜 ${savePct.toFixed(1)}%</div>`
                  : `<div class="hero-divider">💡 與 ${escapeHtml(stats.secondQuote.store)} 並列目前最低價</div>`;
              })() : ""}
            </div>
          ` : `
            <div class="card text-center" style="border-style: dashed; background: #f8fafc;">
              <div class="text-xs font-black text-sub">尚無可換算的最低價紀錄</div>
              <div class="text-xxs text-muted" style="margin-top: 4px;">點擊下方「＋ 新增賣場報價」即可開始自動比價</div>
            </div>
          `}

          <!-- 4. v1.1 直覺白話 新增／編輯報價表單 -->
          <div id="quote-form-wrapper" class="accordion-card ${editingQuote ? "is-editing" : ""}">
            <button type="button" class="accordion-trigger ${uiState.showQuoteForm ? "open" : ""}" onclick="toggleQuoteForm()">
              <div class="row">
                <span class="icon-circle ${editingQuote ? "amber" : ""}">${editingQuote ? "✏️" : "＋"}</span>
                <span id="btn-toggle-quote-form-label" style="font-size: 14px; font-weight: 800; color: #0f172a;">
                  ${editingQuote ? `編輯報價（${escapeHtml(editingQuote.store)}）` : `新增「${escapeHtml(appState.activeStore)}」報價`}
                </span>
              </div>
              <span class="text-xs font-black text-primary">${uiState.showQuoteForm ? "收合 ▲" : "展開填寫 ▼"}</span>
            </button>
            ${uiState.showQuoteForm ? renderV11QuoteFormInner(p, editingQuote) : ""}
          </div>

          <!-- 5. 各賣場報價列表 -->
          <div class="stack-sm">
            <div class="row-between" style="padding: 0 2px;">
              <h3 style="margin: 0; font-size: 14px; font-weight: 900;">📋 各賣場報價（${stats.totalCount}）</h3>
              <div class="sort-toggle">
                <button type="button" class="sort-btn ${uiState.quoteSort === "price" ? "active" : ""}" onclick="setQuoteSort('price')">由便宜到貴</button>
                <button type="button" class="sort-btn ${uiState.quoteSort === "date" ? "active" : ""}" onclick="setQuoteSort('date')">最新日期優先</button>
              </div>
            </div>

            ${displayRanked.length > 0
              ? displayRanked.map(q => renderQuoteCard(p, q)).join("")
              : (stats.references.length === 0 ? `<div class="card text-center text-xs text-muted">尚未記錄任何賣場報價，請於上方表單新增第一筆價格。</div>` : "")}

            ${stats.references.length > 0 ? `
              <div class="stack-sm" style="margin-top: 6px;">
                <div class="text-xs font-black text-muted" style="padding: 0 2px;">📌 參考報價（不參與單位換算排名）</div>
                ${stats.references.map(q => renderReferenceQuoteCard(p, q)).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;

      if (uiState.showQuoteForm) {
        updateQuoteLivePreview();
      }
    }

    /**
     * v1.1 核心直覺報價表單（白話動態標題 + 折疊式多入組乘法算式列 + 白話即時確認區）
     */
    function renderV11QuoteFormInner(p, editingQuote) {
      const dim = getDimensionConfig(p.dimension);
      const stores = getAllStores();
      const defaultStore = editingQuote ? editingQuote.store : appState.activeStore;
      const storeOptions = stores.includes(defaultStore) ? stores : [defaultStore, ...stores];

      const isRef = editingQuote ? Boolean(editingQuote.isReferenceOnly) : false;
      const isMulti = editingQuote ? (!isRef && (parseFloat(editingQuote.packCount) || 1) > 1) : false;

      const priceVal = editingQuote ? editingQuote.price : "";
      const packVal = editingQuote && isMulti ? editingQuote.packCount : "";
      const qtyVal = editingQuote ? editingQuote.unitQty : "";
      const unitVal = editingQuote ? getInputUnitConfig(p.dimension, editingQuote.unit).id : dim.defaultInputUnit;
      const promoVal = editingQuote ? editingQuote.promoType : "原價";
      const dateVal = editingQuote ? editingQuote.checkDate : uiState.todayDate;
      const noteVal = editingQuote ? (editingQuote.note || "") : "";
      const refUnitVal = editingQuote ? (editingQuote.refUnitText || "顆") : "顆";

      const unitOptionsHtml = dim.inputUnits
        .map(u => `<option value="${u.id}" ${u.id === unitVal ? "selected" : ""}>${u.label}</option>`)
        .join("");

      return `
        <div class="stack" style="padding: 14px;">
          <!-- 列 1：購買賣場 與 查價日期 -->
          <div class="grid-2">
            <div>
              <label class="field-label">購買賣場</label>
              <select id="q-store" class="select">
                ${storeOptions.map(s => `<option value="${escapeHtml(s)}" ${s === defaultStore ? "selected" : ""}>${escapeHtml(s)}</option>`).join("")}
              </select>
            </div>
            <div>
              <label class="field-label">查價日期</label>
              <input id="q-date" type="date" class="input input-muted font-bold" value="${escapeHtml(dateVal)}" />
            </div>
          </div>

          <!-- 列 2：價格 (元) *（全寬大輸入格） -->
          <div>
            <label class="field-label">價格 (元)<span class="req">*</span></label>
            <input
              id="q-price"
              type="number"
              inputmode="decimal"
              step="any"
              min="0"
              class="input input-bold"
              value="${escapeHtml(priceVal)}"
              oninput="updateQuoteLivePreview()"
              placeholder="請輸入標價金額（例如 149）"
            />
          </div>

          <!-- 列 3：標準計價規格區（單件模式 vs 多入組乘法算式模式） -->
          <div id="q-standard-area" class="stack-sm ${isRef ? "hidden" : ""}">
            <!-- 單件預設模式：僅顯示 2 欄（動態白話標題 + 單位），完全隱藏入數 -->
            <div id="q-single-row" class="grid-2 ${isMulti ? "hidden" : ""}">
              <div>
                <label class="field-label">${dim.singleQtyLabel}<span class="req">*</span></label>
                <input
                  id="q-single-qty"
                  type="number"
                  inputmode="decimal"
                  step="any"
                  min="0"
                  class="input input-bold"
                  value="${escapeHtml(qtyVal)}"
                  oninput="syncQuoteQtyFrom('single')"
                  placeholder="${dim.singleQtyPlaceholder}"
                />
              </div>
              <div>
                <label class="field-label">單位</label>
                <select id="q-single-unit" class="select" onchange="syncQuoteUnitFrom('single')">
                  ${unitOptionsHtml}
                </select>
              </div>
            </div>

            <!-- 多入組乘法算式列（勾選多入組後展開） -->
            <div id="q-multi-row" class="equation-box ${isMulti ? "" : "hidden"}">
              <div class="equation-grid">
                <div>
                  <label class="field-label">${dim.multiCountLabel}<span class="req">*</span></label>
                  <input
                    id="q-multi-pack"
                    type="number"
                    inputmode="decimal"
                    step="any"
                    min="1"
                    class="input input-bold"
                    value="${escapeHtml(packVal)}"
                    oninput="updateQuoteLivePreview()"
                    placeholder="如 12"
                  />
                </div>
                <div class="equation-times">×</div>
                <div>
                  <label class="field-label">${dim.multiQtyLabel}<span class="req">*</span></label>
                  <input
                    id="q-multi-qty"
                    type="number"
                    inputmode="decimal"
                    step="any"
                    min="0"
                    class="input input-bold"
                    value="${escapeHtml(qtyVal)}"
                    oninput="syncQuoteQtyFrom('multi')"
                    placeholder="如 110"
                  />
                </div>
                <div>
                  <label class="field-label">單位</label>
                  <select id="q-multi-unit" class="select" onchange="syncQuoteUnitFrom('multi')">

                  </select>

              </div>
              <div id="q-multi-total-helper" class="equation-total-helper">👉 總量自動試算：請輸入幾入與每入規格</div>

            <!-- 多入組折疊開關 -->
            <label id="q-multipack-card" class="multipack-toggle-card ${isMulti ? "checked" : ""}">
              <input id="q-multipack-toggle" type="checkbox" ${isMulti ? "checked" : ""} onchange="toggleQuoteMultiPack(this.checked)" />
              <div class="multipack-toggle-text">
                📦 這是多入組
                <span class="multipack-toggle-sub">例如：6瓶裝飲料、12包一串衛生紙、2瓶大組裝</span>
              </div>
            </label>
          </div>

          <!-- 不參與換算之參考報價規格區 -->
          <div id="q-ref-area" class="grid-2 ${isRef ? "" : "hidden"}">
            <div>
              <label class="field-label">參考數量</label>
              <input id="q-ref-qty" type="number" inputmode="decimal" step="any" min="0" class="input input-bold" style="background: #fffbeb; border-color: #fcd34d;" value="${escapeHtml(isRef ? (qtyVal || 1) : 1)}" oninput="updateQuoteLivePreview()" />
            </div>
            <div>
              <label class="field-label">參考單位名稱</label>
              <input id="q-ref-unit" type="text" class="input input-bold" style="background: #fffbeb; border-color: #fcd34d;" value="${escapeHtml(refUnitVal)}" oninput="updateQuoteLivePreview()" placeholder="例如：顆、袋、盒" />
            </div>
          </div>

          <!-- 促銷類型快捷膠囊 -->
          <div>
            <label class="field-label">價格類型 / 促銷自動換算</label>
            <input type="hidden" id="q-promo" value="${escapeHtml(promoVal)}" />
            <div id="q-promo-pills" class="row-wrap">
              ${PROMO_TYPES.map(pt => `
                <button
                  type="button"
                  data-promo="${pt.id}"
                  class="promo-pill ${pt.id === promoVal ? "active" : ""}"
                  onclick="selectQuotePromo('${pt.id}')"
                >${pt.label}</button>
              `).join("")}
            </div>
          </div>

          <!-- 備註與參考報價勾選 -->
          <div class="stack-sm">
            <input id="q-note" type="text" class="input input-muted" value="${escapeHtml(noteVal)}" placeholder="備註（選填，如：週末限定、需滿額）" />
            <label class="row" style="cursor: pointer; font-size: 12px; font-weight: 700; color: var(--text-sub);">
              <input id="q-ref-only" type="checkbox" ${isRef ? "checked" : ""} onchange="toggleQuoteRefOnly(this.checked)" style="width: 18px; height: 18px; accent-color: var(--primary); margin: 0;" />
              <span>不參與單位換算之參考報價（例如重量商品論顆賣）</span>
            </label>
          </div>

          <!-- v1.1 白話即時換算確認區 -->
          <div id="quote-verify-box" class="verify-box">
            輸入價格與規格後，將即時顯示白話確認與歷史最低價比較...
          </div>

          <!-- 送出按鈕列 -->
          <div class="row">
            ${editingQuote ? `<button type="button" class="btn btn-soft" onclick="cancelEditQuote()">取消</button>` : ""}
            <button type="button" class="btn btn-primary btn-full" onclick="saveQuoteFromForm()">
              ${editingQuote ? "💾 更新此筆報價" : "💾 儲存報價並自動排行"}
            </button>
          </div>
        </div>
      `;
    }

    function toggleQuoteForm() {
      if (uiState.showQuoteForm && uiState.editingQuoteId) uiState.editingQuoteId = null;
      uiState.showQuoteForm = !uiState.showQuoteForm;
      renderProductDetail();
    }

    function toggleQuoteMultiPack(checked) {
      document.getElementById("q-single-row")?.classList.toggle("hidden", checked);
      document.getElementById("q-multi-row")?.classList.toggle("hidden", !checked);
      document.getElementById("q-multipack-card")?.classList.toggle("checked", checked);

      if (checked) {
        const sQty = document.getElementById("q-single-qty")?.value || "";
        const sUnit = document.getElementById("q-single-unit")?.value || "";
        const mQtyEl = document.getElementById("q-multi-qty");
        const mUnitEl = document.getElementById("q-multi-unit");
        if (mQtyEl && sQty) mQtyEl.value = sQty;
        if (mUnitEl && sUnit) mUnitEl.value = sUnit;
      } else {
        const mQty = document.getElementById("q-multi-qty")?.value || "";
        const mUnit = document.getElementById("q-multi-unit")?.value || "";
        const sQtyEl = document.getElementById("q-single-qty");
        const sUnitEl = document.getElementById("q-single-unit");
        if (sQtyEl && mQty) sQtyEl.value = mQty;
        if (sUnitEl && mUnit) sUnitEl.value = mUnit;
      }
      updateQuoteLivePreview();
    }

    function syncQuoteQtyFrom(source) {
      const sEl = document.getElementById("q-single-qty");
      const mEl = document.getElementById("q-multi-qty");
      if (source === "single" && sEl && mEl) mEl.value = sEl.value;
      if (source === "multi" && sEl && mEl) sEl.value = mEl.value;
      updateQuoteLivePreview();
    }

    function syncQuoteUnitFrom(source) {
      const sEl = document.getElementById("q-single-unit");
      const mEl = document.getElementById("q-multi-unit");
      if (source === "single" && sEl && mEl) mEl.value = sEl.value;
      if (source === "multi" && sEl && mEl) sEl.value = mEl.value;
      updateQuoteLivePreview();
    }

    function toggleQuoteRefOnly(checked) {
      document.getElementById("q-standard-area")?.classList.toggle("hidden", checked);
      document.getElementById("q-ref-area")?.classList.toggle("hidden", !checked);
      updateQuoteLivePreview();
    }

    function selectQuotePromo(promoId) {
      const hidden = document.getElementById("q-promo");
      if (hidden) hidden.value = promoId;
      document.querySelectorAll("#q-promo-pills button").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-promo") === promoId);
      });
      updateQuoteLivePreview();
    }

    /** 即時更新報價表單的總量試算與白話確認區 */
    function updateQuoteLivePreview() {
      const box = document.getElementById("quote-verify-box");
      const p = getCurrentProduct();
      if (!box || !p) return;

      const isRef = document.getElementById("q-ref-only")?.checked || false;
      const priceVal = document.getElementById("q-price")?.value || "";

      if (isRef) {
        const refQty = document.getElementById("q-ref-qty")?.value || 1;
        const refUnit = document.getElementById("q-ref-unit")?.value || "顆";
        box.className = "verify-box is-ref";
        box.innerHTML = `
          <div class="verify-sentence">📌 參考報價模式（不參與單位換算排行）</div>
          <div>確認內容：花 <strong>$${escapeHtml(priceVal || "--")}</strong> 買 <strong>${escapeHtml(refQty)} ${escapeHtml(refUnit)}</strong></div>
        `;
        return;
      }

      const isMulti = document.getElementById("q-multipack-toggle")?.checked || false;
      const packCount = isMulti ? parseFloat(document.getElementById("q-multi-pack")?.value) : 1;
      const unitQty = parseFloat(isMulti ? document.getElementById("q-multi-qty")?.value : document.getElementById("q-single-qty")?.value);
      const unitId = isMulti ? document.getElementById("q-multi-unit")?.value : document.getElementById("q-single-unit")?.value;
      const promoType = document.getElementById("q-promo")?.value || "原價";
      const unitLabel = getInputUnitConfig(p.dimension, unitId).label;

      // 更新多入組乘法算式下方即時總量提示
      const totalHelper = document.getElementById("q-multi-total-helper");
      if (totalHelper && isMulti) {
        if (isFinite(packCount) && packCount > 0 && isFinite(unitQty) && unitQty > 0) {
          const total = packCount * unitQty;
          totalHelper.textContent = `👉 總量自動試算：${formatNumberWithCommas(packCount)} × ${formatNumberWithCommas(unitQty)} = ${formatNumberWithCommas(total)} ${unitLabel}`;
        } else {
          totalHelper.textContent = `👉 總量自動試算：請填寫「${getDimensionConfig(p.dimension).multiCountLabel}」與「${getDimensionConfig(p.dimension).multiQtyLabel}」`;
        }
      }

      const draft = { price: priceVal, packCount, unitQty, unit: unitId, promoType, isReferenceOnly: false };
      const metrics = calculateQuoteMetrics(p.dimension, draft);

      if (!metrics.valid) {
        box.className = "verify-box";
        box.innerHTML = `<span class="text-muted">填寫上方「價格」與「${getDimensionConfig(p.dimension).singleQtyLabel}」後，此處將立即顯示白話確認與換算單價。</span>`;
        return;
      }

      const dispVal = getDisplayPrice(p.dimension, p.displayUnit, metrics.baseUnitPrice);
      const unitSuffix = getEffectiveUnitSuffix(p.dimension, p.displayUnit, unitId);
      const sentence = buildPlainConfirmationSentence(p.dimension, draft, metrics);

      // 比較現有歷史最低價（編輯時排除自身）
      const otherQuotes = p.quotes.filter(q => q.id !== uiState.editingQuoteId);
      let currentBestBase = Infinity;
      otherQuotes.forEach(q => {
        const m = calculateQuoteMetrics(p.dimension, q);
        if (m.valid && m.baseUnitPrice < currentBestBase) currentBestBase = m.baseUnitPrice;
      });

      let boxClass = "verify-box is-valid";
      let compareHtml = `<div class="verify-compare-line text-primary">✨ 將成為此商品的第一筆換算報價</div>`;

      if (isFinite(currentBestBase)) {
        const diffPct = ((metrics.baseUnitPrice - currentBestBase) / currentBestBase) * 100;
        if (diffPct < -0.05) {
          boxClass = "verify-box is-best";
          compareHtml = `<div class="verify-compare-line text-winner">🏆 破歷史新低！比目前最低便宜 ${Math.abs(diffPct).toFixed(1)}%</div>`;
        } else if (Math.abs(diffPct) <= 0.05) {
          boxClass = "verify-box is-valid";
          compareHtml = `<div class="verify-compare-line text-primary">⚖️ 與目前歷史最低價相同</div>`;
        } else {
          boxClass = "verify-box is-higher";
          compareHtml = `<div class="verify-compare-line text-amber">比歷史最低貴 ${diffPct.toFixed(1)}%</div>`;
        }
      }

      box.className = boxClass;
      box.innerHTML = `
        <div class="verify-sentence">${escapeHtml(sentence)}</div>
        <div class="verify-price-row">
          <span class="font-bold">換算單價</span>
          <span class="verify-price-big">$${formatUnitPrice(dispVal)} <span style="font-size: 13px; font-weight: 700;">/ ${escapeHtml(unitSuffix)}</span></span>
        </div>
        ${compareHtml}
      `;
    }

    function saveQuoteFromForm() {
      const p = getCurrentProduct();
      if (!p) return;

      const store = document.getElementById("q-store")?.value || appState.activeStore;
      const checkDate = document.getElementById("q-date")?.value || uiState.todayDate;
      const price = parseFloat(document.getElementById("q-price")?.value);
      const promoType = document.getElementById("q-promo")?.value || "原價";
      const note = (document.getElementById("q-note")?.value || "").trim();
      const isReferenceOnly = document.getElementById("q-ref-only")?.checked || false;

      if (!isFinite(price) || price <= 0) {
        showToast("請輸入有效的價格金額", "warning");
        document.getElementById("q-price")?.focus();
        return;
      }

      let packCount = 1;
      let unitQty = 1;
      let unit = getDimensionConfig(p.dimension).defaultInputUnit;
      let refUnitText = "";

      if (isReferenceOnly) {
        unitQty = parseFloat(document.getElementById("q-ref-qty")?.value) || 1;
        refUnitText = (document.getElementById("q-ref-unit")?.value || "顆").trim();
      } else {
        const isMulti = document.getElementById("q-multipack-toggle")?.checked || false;
        if (isMulti) {
          packCount = parseFloat(document.getElementById("q-multi-pack")?.value);
          unitQty = parseFloat(document.getElementById("q-multi-qty")?.value);
          unit = document.getElementById("q-multi-unit")?.value || unit;
          if (!isFinite(packCount) || packCount <= 0) {
            showToast(`請輸入「${getDimensionConfig(p.dimension).multiCountLabel}」`, "warning");
            document.getElementById("q-multi-pack")?.focus();
            return;
          }
          if (!isFinite(unitQty) || unitQty <= 0) {
            showToast(`請輸入「${getDimensionConfig(p.dimension).multiQtyLabel}」`, "warning");
            document.getElementById("q-multi-qty")?.focus();
            return;
          }
        } else {
          packCount = 1;
          unitQty = parseFloat(document.getElementById("q-single-qty")?.value);
          unit = document.getElementById("q-single-unit")?.value || unit;
          if (!isFinite(unitQty) || unitQty <= 0) {
            showToast(`請輸入「${getDimensionConfig(p.dimension).singleQtyLabel}」`, "warning");
            document.getElementById("q-single-qty")?.focus();
            return;
          }
        }
      }

      const payload = {
        id: uiState.editingQuoteId || generateId("q"),
        store,
        price,
        packCount,
        unitQty,
        unit,
        promoType,
        checkDate,
        note,
        isReferenceOnly,
        refUnitText
      };

      if (uiState.editingQuoteId) {
        const idx = p.quotes.findIndex(q => q.id === uiState.editingQuoteId);
        if (idx >= 0) p.quotes[idx] = payload;
        showToast(`✅ 已更新「${store}」報價`, "success");
      } else {
        p.quotes.push(payload);
        showToast(`✅ 已儲存「${store}」報價並更新排行`, "success");
      }

      uiState.editingQuoteId = null;
      uiState.showQuoteForm = false;
      saveData();
      renderProductDetail();
    }

    function renderQuoteCard(p, q) {
      const isBest = q.priceRank === 1 || q.diffPct === 0;
      const dispVal = getDisplayPrice(p.dimension, p.displayUnit, q.baseUnitPrice);
      const unitSuffix = getEffectiveUnitSuffix(p.dimension, p.displayUnit, q.unit);
      const promoCfg = getPromoConfig(q.promoType);
      const fresh = getFreshnessInfo(q.checkDate);
      const isToday = q.checkDate === uiState.todayDate;

      return `
        <div class="quote-card ${isBest ? "is-winner" : ""}">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
            <div class="stack-sm" style="gap: 4px; min-width: 0; flex: 1;">
              <div class="row-wrap">
                ${isBest
                  ? `<span class="badge badge-pill badge-winner">🏆 最划算</span>`
                  : `<span class="badge badge-pill badge-slate">#${q.priceRank} +${q.diffPct.toFixed(1)}%</span>`}
                <strong style="font-size: 16px;">${escapeHtml(q.store)}</strong>
                <span class="badge ${promoCfg.badgeClass}">${promoCfg.label}</span>
              </div>
              <div class="text-xs font-bold text-sub">${escapeHtml(formatHumanSpec(p.dimension, q))}</div>
              ${q.promoType === "買一送一" || q.promoType === "第二件5折" ? `
                <div class="text-xxs font-bold text-amber">⚡ ${escapeHtml(buildPlainConfirmationSentence(p.dimension, q, q.metrics).replace("確認內容：", ""))}</div>
              ` : ""}
              ${q.note ? `<div class="text-xxs text-muted">📝 ${escapeHtml(q.note)}</div>` : ""}
            </div>

            <div class="text-right" style="flex-shrink: 0;">
              <div class="price-figure ${isBest ? "text-winner" : ""}">$${formatUnitPrice(dispVal)}</div>
              <div class="text-xxs font-bold text-muted" style="margin-top: 2px;">每 ${escapeHtml(unitSuffix)}</div>
            </div>
          </div>

          <div class="card-footer-bar">
            <div class="row-wrap" style="gap: 5px;">
              <span class="text-xxs font-bold text-muted">📅 ${escapeHtml(q.checkDate)}</span>
              <span class="badge badge-pill ${fresh.badgeClass}" style="font-size: 10px;">${fresh.label}</span>
            </div>
            <div class="row" style="gap: 5px; margin-left: auto;">
              <button type="button" class="btn btn-xs ${isToday ? "btn-emerald-soft" : "btn-soft"}" style="${isToday ? "" : "border-color: rgba(15,118,110,0.4); color: var(--primary);"}" onclick="confirmQuoteUnchanged('${p.id}', '${q.id}')">
                ${isToday ? "✓ 今日已確認" : "✓ 價格未變"}
              </button>
              <button type="button" class="btn btn-soft btn-xs" onclick="startEditQuote('${q.id}')">編輯</button>
              <button type="button" class="btn btn-rose-soft btn-xs" onclick="confirmDeleteQuote('${p.id}', '${q.id}')">刪除</button>
            </div>
          </div>
        </div>
      `;
    }

      const promoCfg = getPromoConfig(q.promoType);
      const fresh = getFreshnessInfo(q.checkDate);
      const isToday = q.checkDate === uiState.todayDate;

      return `
        <div class="quote-card is-ref">
          <div class="row-between" style="align-items: flex-start;">
            <div class="stack-sm" style="gap: 4px;">
              <div class="row-wrap">
                <span class="badge badge-pill badge-amber">📌 參考價</span>
                <strong style="font-size: 15px;">${escapeHtml(q.store)}</strong>
                <span class="badge ${promoCfg.badgeClass}">${promoCfg.label}</span>
              </div>
              ${q.note ? `<div class="text-xxs text-muted">📝 ${escapeHtml(q.note)}</div>` : ""}
            </div>
            <div class="text-right" style="flex-shrink: 0;">
              <div style="font-size: 16px; font-weight: 900;">${escapeHtml(formatHumanSpec(p.dimension, q))}</div>
              <div class="text-xxs font-bold text-amber">不參與單位換算</div>
            </div>

          <div class="card-footer-bar">
            <div class="row-wrap" style="gap: 5px;">

            </div>
            <div class="row" style="gap: 5px; margin-left: auto;">
              <button type="button" class="btn btn-xs ${isToday ? "btn-emerald-soft" : "btn-soft"}" onclick="confirmQuoteUnchanged('${p.id}', '${q.id}')">
                ${isToday ? "✓ 今日已確認" : "✓ 價格未變"}
              </button>
              <button type="button" class="btn btn-soft btn-xs" onclick="startEditQuote('${q.id}')">編輯</button>
              <button type="button" class="btn btn-rose-soft btn-xs" onclick="confirmDeleteQuote('${p.id}', '${q.id}')">刪除</button>
            </div>
          </div>
        </div>
      `;
